- id: gdpr
  name: General Data Protection Regulation
  short_name: GDPR
  jurisdiction: European Union / EEA
  geographies: [EU, EEA]
  data_classifications_any: [pii, spi, phi, children, biometric]
  description: Processing of personal data of individuals in the EU/EEA (also applies extra-territorially).
  reference: Regulation (EU) 2016/679
  obligations: [Lawful basis and purpose limitation, Data-subject rights, DPIA for high-risk processing, International transfer safeguards, Breach notification]
- id: uk-gdpr
  name: UK GDPR and Data Protection Act 2018
  short_name: UK GDPR
  jurisdiction: United Kingdom
  geographies: [UK, GB]
  data_classifications_any: [pii, spi, phi, children, biometric]
- id: ccpa-cpra
  name: California Consumer Privacy Act / California Privacy Rights Act
  short_name: CCPA/CPRA
  jurisdiction: California, USA
  geographies: [US-CA, US]
  data_classifications_any: [pii, spi, biometric]
  applicability_note: Applies to businesses meeting CCPA thresholds that process personal information of California residents.
- id: india-dpdp
  name: Digital Personal Data Protection Act, 2023
  short_name: India DPDP Act
  jurisdiction: India
  geographies: [IN]
  data_classifications_any: [pii, spi, children, financial, phi, biometric]
  obligations: [Notice and consent, Purpose limitation, Data principal rights, Significant Data Fiduciary obligations where notified, Breach reporting]
- id: singapore-pdpa
  name: Personal Data Protection Act (Singapore)
  short_name: PDPA (SG)
  geographies: [SG]
  data_classifications_any: [pii, spi]
- id: lgpd
  name: Lei Geral de Protecao de Dados
  short_name: LGPD
  geographies: [BR]
  data_classifications_any: [pii, spi]
- id: pipeda
  name: Personal Information Protection and Electronic Documents Act
  short_name: PIPEDA
  geographies: [CA]
  data_classifications_any: [pii, spi]
- id: au-privacy-act
  name: Privacy Act 1988 (Australia)
  short_name: AU Privacy Act
  geographies: [AU]
  data_classifications_any: [pii, spi]
- id: uae-pdpl
  name: UAE Personal Data Protection Law
  short_name: UAE PDPL
  geographies: [AE]
  data_classifications_any: [pii, spi]
- id: ksa-pdpl
  name: Saudi Personal Data Protection Law
  short_name: KSA PDPL
  geographies: [SA]
  data_classifications_any: [pii, spi]
- id: iso-27001
  name: ISO/IEC 27001 Information Security Management
  short_name: ISO 27001
  geographies: [GLOBAL]
  applicability_note: Relevant if the client or delivery organisation is certified, or contractually requires ISO 27001-aligned controls.
- id: soc2
  name: SOC 2 (AICPA Trust Services Criteria)
  short_name: SOC 2
  geographies: [GLOBAL]
  applicability_note: Relevant where the client requires SOC 2 reports from service providers or operates a service.
- id: eu-ai-act
  name: EU Artificial Intelligence Act
  short_name: EU AI Act
  geographies: [EU, EEA]
  technologies_any: [machine_learning, generative_ai, agentic_ai, ai_agents, rag]
  description: Risk-based obligations for AI systems placed on the EU market or affecting people in the EU.
