  category: technology
  dimension: bi_readiness
  answer_type: multi_choice
  options:
    - {value: power_bi, label: Power BI}
    - {value: tableau, label: Tableau}
    - {value: qlik, label: Qlik}
    - {value: looker, label: Looker}
    - {value: legacy, label: 'Legacy (Cognos, BusinessObjects, MicroStrategy, SSRS)'}
    - {value: excel, label: Mainly Excel}
- {id: bi-kpi-definitions, text: 'Are KPI definitions documented in a business glossary with owners?', category: business, dimension: bi_readiness,
  weight: 1.5, critical: true}
