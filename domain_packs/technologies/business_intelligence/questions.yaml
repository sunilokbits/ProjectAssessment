- {id: bi-adoption, text: 'Is there an adoption plan (training, champions, usage monitoring)?', category: business, dimension: stakeholder_readiness}
- {id: bi-skills, text: 'How experienced is the client team with BI tools and data modelling (1-5)?', category: delivery, dimension: team_capability,
