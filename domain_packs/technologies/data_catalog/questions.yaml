- id: dc-tool
  text: Is a data catalog tool in place or selected?
  category: technology
  dimension: data_catalog_readiness
  answer_type: single_choice
  options:
  - value: none
    label: No catalog
    score: 0.2
  - value: selected
    label: Selected, not deployed
    score: 0.5
  - value: deployed
    label: Deployed with partial coverage
    score: 0.8
  - value: adopted
    label: Deployed and widely adopted
    score: 1
- id: dc-coverage
  text: Which platforms must the catalog cover (warehouse, lake, BI, operational databases)?
  category: data
  dimension: data_catalog_readiness
  answer_type: text
- id: dc-curation
  text: Are owners and stewards committed to curating descriptions and certifications?
  category: governance
  dimension: data_catalog_readiness
  answer_type: yes_no
  critical: true
- id: dc-classification
  text: Will the catalog tag sensitive data classifications automatically?
  category: privacy
  dimension: privacy_protection
  answer_type: yes_no
- id: dc-access-requests
  text: Should data access requests be raised and approved through the catalog?
  category: security
  dimension: data_catalog_readiness
  answer_type: yes_no
- id: dc-adoption
  text: Is there an adoption plan (training, champions, usage metrics)?
  category: business
  dimension: stakeholder_readiness
  answer_type: yes_no
- id: dc-skills
  text: How experienced is the client team with administering a data catalog (1-5)?
  category: delivery
  dimension: team_capability
  answer_type: scale
  equivalence_key: client_skills
