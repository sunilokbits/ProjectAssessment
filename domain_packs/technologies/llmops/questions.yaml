- id: llmops-versioning
  text: Are prompts, model versions and configurations version-controlled and released together?
  category: operations
  dimension: llmops_readiness
  answer_type: yes_no
- id: llmops-offline-eval
  text: Is there automated offline evaluation (golden sets, LLM-as-judge) gating releases?
