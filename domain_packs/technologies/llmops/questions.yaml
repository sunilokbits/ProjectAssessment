  dimension: llmops_readiness
  answer_type: yes_no
  weight: 1.5
  critical: true
- id: llmops-tracing
  text: Are production requests traced end-to-end (prompt, retrieval, tool calls, latency, tokens)?
  category: operations
  dimension: operational_readiness
  answer_type: yes_no
- id: llmops-feedback
  text: Is user feedback captured and routed into evaluation datasets?
  category: quality
  dimension: llmops_readiness
  answer_type: yes_no
- id: llmops-cost
  text: Are token usage, cost per request and quotas monitored with budgets?
  category: operations
  dimension: llmops_readiness
  answer_type: yes_no
- id: llmops-gateway
  text: Is there an AI gateway for routing, rate limiting, fallback and central logging?
