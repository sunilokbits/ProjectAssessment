# Snowflake technology pack - questions
- id: sf-status
  text: Does the client already use Snowflake, and on which cloud / region?
  category: technology
  dimension: snowflake_platform_readiness
  answer_type: single_choice
  options:
    - {value: none, label: No Snowflake, score: 0.3}
    - {value: pilot, label: Pilot / sandbox, score: 0.6}
    - {value: production, label: Production accounts, score: 1}
- {id: sf-rbac, text: 'Is a Snowflake role hierarchy (functional and access roles) designed?', category: security, dimension: snowflake_platform_readiness,
  weight: 1.5, critical: true}
