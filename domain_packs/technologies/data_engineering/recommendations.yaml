# Data Engineering technology pack - recommendations
- {id: pipelines-as-code, title: Treat pipelines as code, text: Version-control all pipeline code and configuration and deploy via CI/CD with
    automated tests., category: operations, priority: high}
- {id: elt-pattern, title: Prefer ELT on the target platform, text: Land raw data first and transform inside the scalable target platform using
