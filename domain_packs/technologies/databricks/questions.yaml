  dimension: databricks_platform_readiness
  weight: 1.5
  critical: true
- id: network-isolation
  text: Is the workspace deployed with private networking (VNet/VPC injection, private link, no public IP)?
  category: security
  dimension: security_controls
- id: compute-policies
  text: Are cluster/compute policies and serverless usage rules defined to control cost and security?
  category: technology
  dimension: databricks_platform_readiness
- id: medallion
  text: Is a medallion (bronze/silver/gold) layering standard agreed for the lakehouse?
