- id: existing-workspace
  text: Does the client already have Databricks workspaces, and on which cloud (Azure, AWS, GCP)?
  category: technology
  dimension: databricks_platform_readiness
  answer_type: single_choice
  options:
    - {value: none, label: No existing Databricks, score: 0.3}
    - {value: pilot, label: Pilot / sandbox only, score: 0.6}
    - {value: production, label: Production workspaces in use, score: 1}
- id: unity-catalog
  text: Is Unity Catalog enabled with a defined catalog/schema and access-control model?
