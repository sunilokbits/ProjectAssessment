# Azure technology pack - terminology
- term: Landing Zone
  definition: Pre-configured, governed Azure environment for workloads
  synonyms: [alz]
  entity_type: system
  category: infrastructure
- {term: Management Group, definition: Azure hierarchy level for applying policy across subscriptions, entity_type: concept, category: governance}
- term: Microsoft Entra ID
  definition: Microsoft cloud identity service
  synonyms: [azure ad, aad]
