security_considerations:
- id: agentic-scoped-identity
  text: Each agent runs under its own scoped identity; secrets are never exposed to the model.
  category: security
- id: agentic-arg-validation
  text: Validate tool arguments server-side; never trust model-produced parameters.
  category: security
