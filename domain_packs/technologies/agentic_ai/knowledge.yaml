- id: agentic-ai-cascade
  text: Errors compound across multi-step plans.
  category: ai
- id: agentic-ai-goal
  text: Goal misinterpretation leading to wrong actions.
  category: ai
dependencies:
- id: agentic-api-layer
  text: API layer over target systems with authentication and rate limits.
  category: integration
