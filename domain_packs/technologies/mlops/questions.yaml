- id: mlops-registry
  text: Is there a model registry with versioning, lineage and stage approvals?
  category: technology
  dimension: mlops_readiness
  answer_type: yes_no
  weight: 1.5
  critical: true
- id: mlops-cicd
  text: Are model training and deployment automated through CI/CD pipelines?
  category: operations
  dimension: mlops_readiness
  answer_type: yes_no
- id: mlops-monitoring
  text: Are data drift, prediction drift and business performance monitored for production models?
