- {id: authorised-services-only, title: Restrict design to authorised cloud services, text: "Build the bill of materials only from services authorised at the required FedRAMP / StateRAMP / IRAP level.", category: architecture, priority: high, when: {technologies_any: [azure, aws, gcp, databricks, snowflake, microsoft_fabric, cloud_migration]}, decision_key: hosting_region, decision_option: government_cloud}
- {id: start-ato-early, title: Start the ATO package in discovery, text: "Engage the authorising official and ISSO early; draft the system security plan alongside the design.", category: compliance, priority: high, sub_domains: [central_government, state_government, tax_revenue, citizen_services]}
- {id: data-sharing-agreements, title: Put data-sharing agreements in place before integration, category: governance, priority: high, rationale: Cross-agency data use without statutory basis is a common blocker.}
- {id: algorithmic-impact, title: Run an algorithmic impact assessment, text: "Assess bias, explainability and appeal routes for any AI affecting citizen entitlements.", category: governance, priority: medium, when: {technologies_any: [machine_learning, generative_ai, agentic_ai, ai_agents]}}
- {id: incremental-delivery, title: Deliver in increments aligned to budget cycles, text: "Structure delivery into fundable increments that each deliver measurable public value.", category: delivery, priority: medium}
