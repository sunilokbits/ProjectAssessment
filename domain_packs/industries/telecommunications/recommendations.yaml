- {id: pseudonymise-identifiers, title: Pseudonymise subscriber identifiers at ingestion, text: Tokenise MSISDN / IMSI / IMEI and restrict location and CPNI to approved use cases., category: security, priority: high}
- {id: separate-li, title: Keep lawful interception and retention systems separate, text: Do not replicate LI or mandatory retention data into analytics platforms., category: compliance, priority: high}
- {id: ra-reconciliation, title: Build end-to-end revenue assurance reconciliation, text: Reconcile network usage to mediated and rated records and billed revenue with automated exception reporting., category: data, priority: high, sub_domains: [billing, revenue_assurance, oss_bss]}
- {id: parallel-bill-runs, title: Run parallel bill runs before billing cut-over, text: Compare invoices and revenue between legacy and new billing for at least one full cycle., category: delivery, priority: high, when: {technologies_any: [data_migration, application_modernization, database_migration, cloud_migration]}, sub_domains: [billing, oss_bss], decision_key: delivery_approach, decision_option: phased_parallel_run}
- {id: churn-uplift, title: Measure churn interventions with control groups, text: Optimise retention for uplift rather than churn probability alone and track incremental saves., category: business, priority: medium, when: {project_types_any: [churn_prediction]}}
- {id: in-country-telco, title: Host subscriber and network data in-country where licences require, text: Use in-country regions for subscriber and network data in jurisdictions with licence-based localisation., category: architecture, priority: high, when: {geographies_any: [IN, SA, AE, CN]}, decision_key: hosting_region, decision_option: in_country}
