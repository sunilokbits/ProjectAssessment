- {id: cpni-exposure, title: "CPNI, CDR or location data exposure", category: security, likelihood: 3, impact: 5, mitigation: "Classify subscriber data, pseudonymise MSISDN / IMSI, restrict location data and audit access.", indicators: [cpni, cdr, msisdn, imsi, location data, call records]}
- {id: lawful-intercept-breach, title: "Lawful interception or retained data accessed outside licence conditions", category: compliance, likelihood: 2, impact: 5, mitigation: "Physically and logically separate LI and retention systems from analytics; restrict to cleared staff.", indicators: [lawful interception, data retention, li, law enforcement]}
- {id: revenue-leakage, title: "Revenue leakage between usage, rating and billing", category: financial, likelihood: 3, impact: 4, mitigation: "End-to-end revenue assurance controls and reconciliation dashboards.", sub_domains: [billing, revenue_assurance, oss_bss], indicators: [revenue leakage, unbilled usage, rating errors, reconciliation]}
- {id: billing-migration-errors, title: "Billing errors and bill shock after migration", category: business, likelihood: 3, impact: 5, mitigation: "Parallel bill runs, sample bill verification and revenue reconciliation before cut-over.", sub_domains: [billing, oss_bss], when: {technologies_any: [data_migration, application_modernization, database_migration, cloud_migration]}}
- {id: data-volume-cost, title: "CDR and network data volumes drive cost and performance issues", category: architecture, likelihood: 4, impact: 3, mitigation: "Partitioning, tiered retention, aggregation at ingestion and FinOps monitoring.", indicators: [cdr volume, xdr, probe data, billions of records, petabytes]}
- {id: telecom-fraud, title: "Telecom fraud losses (IRSF, SIM box, subscription fraud)", category: financial, likelihood: 3, impact: 4, mitigation: "Near-real-time fraud detection with case management and feedback loops.", sub_domains: [revenue_assurance], indicators: [irsf, sim box, wangiri, subscription fraud, bypass]}
- {id: churn-model-inaction, title: "Churn predictions not converted into effective retention actions", category: business, likelihood: 3, impact: 3, mitigation: "Integrate scores with retention channels and measure uplift with control groups.", sub_domains: [churn, customer_analytics], when: {project_types_any: [churn_prediction]}}
- {id: inventory-inaccuracy, title: "Inaccurate network and service inventory undermines analytics", category: data, likelihood: 4, impact: 3, mitigation: "Inventory reconciliation with network discovery and service-to-customer mapping.", sub_domains: [network_operations, oss_bss, five_g, fixed_broadband], indicators: [network inventory, stale inventory, cell site]}
- {id: data-localisation-telecom, title: "Subscriber or network data hosted outside permitted jurisdiction", category: compliance, likelihood: 3, impact: 4, mitigation: "Confirm licence and localisation obligations and select in-country regions.", indicators: [data localisation, in-country, licence condition, offshore], when: {technologies_any: [azure, aws, gcp, databricks, snowflake, microsoft_fabric, cloud_migration]}}
- {id: network-outage-impact, title: "Changes to OSS or network tooling affect network operations", category: operational, likelihood: 2, impact: 5, mitigation: "Read-only analytics first, change control with NOC and rollback plans.", sub_domains: [network_operations, five_g, oss_bss], indicators: [noc, outage, network change, alarm storm]}
- {id: marketing-consent-breach, title: "Retention or marketing outreach violates consent or DND rules", category: privacy, likelihood: 3, impact: 4, mitigation: "Enforce consent and DND registries in campaign tooling.", sub_domains: [customer_analytics, churn, digital_services], indicators: [dnd, do not call, marketing consent, sms campaign]}
