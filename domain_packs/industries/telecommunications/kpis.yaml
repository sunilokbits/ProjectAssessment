- {id: churn-rate, name: Churn rate, description: Share of subscribers leaving in a period., formula: subscribers lost / average subscribers, unit: "%", direction: lower_is_better, category: customer}
- {id: arpu, name: ARPU, description: Average revenue per user per period., formula: service revenue / average subscribers, unit: currency, direction: higher_is_better, category: financial}
- {id: network-availability, name: Network availability, description: Share of time network services are available., unit: "%", direction: higher_is_better, category: network, sub_domains: [network_operations, five_g, fixed_broadband]}
- {id: dropped-call-rate, name: Dropped call rate, description: Share of established calls dropped abnormally., unit: "%", direction: lower_is_better, category: network, sub_domains: [network_operations, five_g]}
- {id: call-setup-success, name: Call / session setup success rate, description: Share of call or data session attempts successfully established., unit: "%", direction: higher_is_better, category: network, sub_domains: [network_operations, five_g]}
- {id: revenue-leakage-rate, name: Revenue leakage, description: Unbilled or under-billed revenue relative to billable revenue., unit: "%", direction: lower_is_better, category: financial, sub_domains: [revenue_assurance, billing]}
- {id: billing-accuracy, name: Billing accuracy, description: Share of invoices issued without error or dispute., unit: "%", direction: higher_is_better, category: operational, sub_domains: [billing]}
- {id: mttr-network, name: Network mean time to repair, description: Average time to restore network faults., unit: hours, direction: lower_is_better, category: network, sub_domains: [network_operations, fixed_broadband]}
- {id: nps, name: Net promoter score, description: Customer likelihood to recommend., unit: score, direction: higher_is_better, category: customer, sub_domains: [customer_analytics, churn, digital_services]}
- {id: fraud-loss, name: Fraud loss rate, description: Fraud losses relative to revenue., unit: "%", direction: lower_is_better, category: risk, sub_domains: [revenue_assurance]}
- {id: data-throughput, name: Average user data throughput, description: Average downlink throughput experienced by users., unit: Mbps, direction: higher_is_better, category: network, sub_domains: [network_operations, five_g, fixed_broadband]}
- {id: first-contact-resolution, name: First contact resolution, description: Share of customer issues resolved in the first interaction., unit: "%", direction: higher_is_better, category: customer, sub_domains: [customer_analytics, digital_services]}
- {id: truck-roll-rate, name: Truck roll rate, description: Field visits per 100 broadband subscribers per period., unit: per 100 subscribers, direction: lower_is_better, category: operational, sub_domains: [fixed_broadband]}
