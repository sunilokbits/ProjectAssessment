key: telecommunications
name: Telecommunications
kind: industry
version: 1.0.0
description: Mobile, fixed, broadband and enterprise communications service providers covering network operations, OSS/BSS, billing, revenue assurance, customer analytics, churn and 5G.
aliases: [telecom, telco, communications service provider, csp, mobile operator, mno, isp, carrier]
sort_order: 60
sub_domains:
  - key: network_operations
    name: Network Operations
    description: Network monitoring, fault and performance management, NOC operations and capacity planning.
    keywords: [network operations, noc, fault management, performance management, alarm, network kpi, capacity planning, ran, core network, transport network]
  - key: customer_analytics
    name: Customer Analytics
    description: Subscriber segmentation, usage analytics, next best offer and customer experience.
    keywords: [subscriber analytics, customer experience, usage analytics, next best offer, segmentation, nps, customer journey, arpu analysis]
  - key: billing
    name: Billing and Charging
    description: Rating, charging, invoicing, prepaid and postpaid billing and mediation.
    keywords: [billing, charging, rating, mediation, invoice, prepaid, postpaid, ocs, online charging, convergent billing, bill shock]
  - key: revenue_assurance
    name: Revenue Assurance and Fraud
    description: Revenue leakage detection, usage reconciliation, interconnect and telecom fraud management.
    keywords: [revenue assurance, revenue leakage, usage reconciliation, interconnect, roaming settlement, fraud management, sim box, irsf, wangiri, subscription fraud]
  - key: churn
    name: Churn and Retention
    description: Churn prediction, retention offers and port-out management.
    keywords: [churn, churn prediction, retention, port-out, mnp, win-back, save desk, customer attrition]
  - key: five_g
    name: 5G and Network Modernisation
    description: 5G standalone, network slicing, Open RAN, edge computing and private networks.
    keywords: [5g, 5g sa, network slicing, open ran, o-ran, mec, multi-access edge computing, private 5g, cloud-native network functions, cnf]
  - key: oss_bss
    name: OSS/BSS
    description: Operations and business support systems including inventory, order management, CRM and product catalogue.
    keywords: [oss, bss, oss/bss, service inventory, order management, product catalog, service assurance, tm forum, oda, open apis, provisioning]
  - key: fixed_broadband
    name: Fixed and Broadband
    description: FTTH, DSL, cable, field service and home network experience.
    keywords: [ftth, fibre, fiber, broadband, gpon, dsl, docsis, cpe, home wifi, field technician, truck roll]
  - key: enterprise_wholesale
    name: Enterprise and Wholesale
    description: B2B connectivity, SD-WAN, managed services, wholesale and interconnect.
    keywords: [enterprise services, b2b, sd-wan, mpls, managed services, wholesale, carrier services, sla management, iot connectivity]
  - key: digital_services
    name: Digital Services and Channels
    description: Self-care apps, digital sales, content and partner services.
    keywords: [self-care app, digital channel, ott, content partnership, digital sales, esim, mobile money]
