business_processes:
  - Record-to-report
  - Procure-to-pay
  - Order-to-cash
  - Hire-to-retire
  - Plan-to-perform (FP&A)
  - Lead-to-opportunity
  - Case-to-resolution
  - Incident-to-resolution
  - Source-to-contract
  - Request-to-fulfil (IT)
capabilities:
  - Finance and management reporting
  - Spend and supplier analytics
  - People analytics
  - Sales pipeline and revenue analytics
  - Customer service analytics
  - IT operations analytics and AIOps
  - Enterprise copilots and knowledge assistants
  - Process mining
source_systems:
  - "ERP (SAP S/4HANA / ECC, Oracle Fusion / EBS, Microsoft Dynamics 365, Infor, NetSuite)"
  - "HCM and payroll (Workday, SAP SuccessFactors, Oracle HCM, ADP, UKG)"
  - "Procurement (SAP Ariba, Coupa, Jaggaer, Ivalua)"
  - "CRM (Salesforce, Microsoft Dynamics 365, HubSpot)"
  - "Contact centre and service (Genesys, NICE, Five9, Zendesk, Salesforce Service Cloud)"
  - "ITSM and observability (ServiceNow, Jira Service Management, BMC Helix, Splunk, Datadog)"
  - "EPM (Oracle EPM, OneStream, Anaplan, SAP Analytics Cloud)"
  - "Collaboration and documents (Microsoft 365, SharePoint, Google Workspace)"
data_entities: [Legal entity, Cost centre, GL account, Journal, Employee, Position, Supplier, Purchase order, Invoice, Customer, Opportunity, Case, Incident, Configuration item]
integration_patterns:
  - "ERP extraction (SAP ODP / SLT, Oracle BICC)"
  - SaaS application APIs and managed connectors
  - Batch file interfaces
  - Event-driven integration via iPaaS
  - Identity federation and SCIM
related_technologies: [sap_integration, salesforce_integration, power_bi, data_governance, generative_ai]
related_project_types: [bi_modernization, data_platform_modernization, customer_360, genai_assistant]
