key: cross_industry
name: Cross-industry Enterprise
kind: industry
version: 1.0.0
description: Generic enterprise functions applicable to any industry - finance, HR, procurement, sales and marketing, customer service and IT operations. Used when the industry is generic or unknown.
aliases: [enterprise, generic, corporate functions, back office, horizontal]
sort_order: 999
sub_domains:
  - key: finance
    name: Finance
    keywords: [general ledger, financial close, accounts payable, accounts receivable, fp&a, budgeting, consolidation, management accounts, treasury]
  - key: hr
    name: Human Resources
    keywords: [hr, human resources, payroll, workforce, headcount, talent acquisition, attrition, performance management, people analytics, hcm]
  - key: procurement
    name: Procurement
    keywords: [procurement, purchasing, sourcing, spend analytics, supplier management, purchase order, contract management, p2p, procure-to-pay]
  - key: sales_marketing
    name: Sales and Marketing
    keywords: [sales pipeline, crm, opportunities, lead management, marketing campaigns, marketing attribution, customer segmentation, revenue operations]
  - key: customer_service
    name: Customer Service
    keywords: [contact centre, customer service, service desk, case management, tickets, csat, first contact resolution, call centre]
  - key: it_operations
    name: IT Operations
    keywords: [it operations, itsm, incident management, service management, observability, aiops, asset management, cmdb, change management]
detection:
  keywords:
    enterprise: 1
    erp: 1.5
    general ledger: 2
    financial close: 2.5
    payroll: 2
    procurement: 2
    spend analytics: 2.5
    crm: 1.5
