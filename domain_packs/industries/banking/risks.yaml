- {id: pii-exposure, title: Customer PII / account data exposure, category: security, likelihood: 3, impact: 5, mitigation: "Classify data, tokenise/mask PII, enforce column/row-level security and monitoring.", indicators: [pii, customer data, account number, aadhaar, pan card, ssn]}
- {id: financial-reconciliation, title: Financial data does not reconcile with the general ledger, category: data, likelihood: 3, impact: 5, mitigation: "Design reconciliation controls (counts, balances, hash totals) per layer; sign-off with finance.", indicators: [reconciliation, general ledger, gl, balances]}
- {id: kyc-aml-impact, title: Unassessed impact on KYC/AML processes, category: compliance, likelihood: 2, impact: 5, mitigation: "Engage financial-crime compliance; include KYC/AML data in impact assessment.", indicators: [kyc, aml, sanctions, transaction monitoring]}
- {id: transaction-consistency, title: Transaction duplication or loss between intraday and EOD feeds, category: data, likelihood: 3, impact: 4, mitigation: "Idempotent ingestion, unique transaction keys, control totals per batch.", indicators: [transaction, intraday, eod, end of day]}
- {id: regulatory-reporting, title: Regulatory reports affected by data or logic changes, category: compliance, likelihood: 3, impact: 5, mitigation: "Parallel run regulatory reports and reconcile before cut-over.", indicators: [regulatory report, rbi return, corep, finrep, xbrl]}
- {id: model-risk, title: Models not approved under model risk management, category: compliance, likelihood: 3, impact: 4, mitigation: "Engage model risk early; document model, validation and monitoring.", when: {technologies_any: [machine_learning, generative_ai, agentic_ai, ai_agents, advanced_analytics]}}
- {id: pci-scope-creep, title: Platform pulled into PCI DSS scope, category: security, likelihood: 3, impact: 4, mitigation: "Tokenise PAN before landing; segment the cardholder data environment.", sub_domains: [cards, payments], indicators: [pan, card number, cardholder]}
- {id: outsourcing-approval, title: Cloud / outsourcing regulatory approval delays, category: compliance, likelihood: 3, impact: 4, mitigation: "Start outsourcing risk assessment and regulator notification early.", when: {technologies_any: [azure, aws, gcp, databricks, snowflake, microsoft_fabric]}}
- {id: legacy-core, title: Legacy core banking extract constraints, category: integration, likelihood: 4, impact: 3, mitigation: "Agree extract windows with core banking team; evaluate CDC tooling.", indicators: [mainframe, legacy core, cobol, as400]}
