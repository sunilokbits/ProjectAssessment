- id: india-dpdp
  name: Digital Personal Data Protection Act 2023
  short_name: DPDP Act
  geographies: [IN]
  data_classifications_any: [pii]
- id: eu-animal-health-law
  name: EU Animal Health Law (Regulation 2016/429) identification and registration
  short_name: EU Animal Health Law
  geographies: [EU, EEA]
  sub_domains: [livestock]
- id: usda-adt
  name: USDA Animal Disease Traceability rule
  short_name: USDA ADT
  geographies: [US]
  sub_domains: [livestock]
- id: globalgap
  name: GLOBALG.A.P. Integrated Farm Assurance
  short_name: GLOBALG.A.P.
  geographies: [GLOBAL]
  sub_domains: [crop_analytics, agri_supply_chain, livestock]
