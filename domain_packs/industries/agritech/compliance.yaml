- id: eudr
  name: EU Deforestation Regulation (EU) 2023/1115
  short_name: EUDR
  geographies: [EU, EEA]
  sub_domains: [agri_supply_chain]
  applicability_note: "Covers cattle, cocoa, coffee, oil palm, rubber, soy and wood placed on or exported from the EU market; check current application dates."
- id: fsma-204
  name: FDA FSMA Section 204 Food Traceability Rule
  short_name: FSMA 204
  geographies: [US]
  sub_domains: [agri_supply_chain]
- id: eu-cap
  name: EU Common Agricultural Policy (IACS / LPIS reporting)
  short_name: EU CAP
  geographies: [EU, EEA]
  sub_domains: [farm_finance, crop_analytics, precision_farming]
- id: eu-ag-data-code
  name: EU Code of Conduct on Agricultural Data Sharing by Contractual Agreement
  short_name: EU Ag Data Code
  geographies: [EU, EEA]
  applicability_note: Voluntary code; reflects good practice for farmer data consent and ownership.
- id: ag-data-transparent
  name: Ag Data Transparent / American Farm Bureau Core Principles for Agricultural Data
  short_name: Ag Data Transparent
  geographies: [US]
  applicability_note: Voluntary certification of farm data contracts.
- id: gdpr
  name: General Data Protection Regulation
  short_name: GDPR
  geographies: [EU, EEA, UK]
