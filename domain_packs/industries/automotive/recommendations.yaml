- {id: vin-master-first, title: Establish the VIN master and configuration data first, text: Use build data as the VIN master and standardise VINs in all sources before analytics., category: data, priority: high}
- {id: consent-by-design, title: Enforce consent and purpose limitation for vehicle data, text: Capture consent per market and enforce it at ingestion and access; pseudonymise VIN and location where possible., category: governance, priority: high, sub_domains: [connected_vehicle, telematics, mobility_services]}
- {id: csms-scope, title: Bring vehicle backends into CSMS scope, text: Perform TARA for cloud components interacting with vehicles or OTA and monitor through a VSOC., category: security, priority: high, sub_domains: [connected_vehicle, product_engineering, telematics]}
- {id: telemetry-finops, title: Apply edge filtering and FinOps to telemetry, text: Prioritise signals and sampling rates and use tiered storage to control telemetry cost., category: architecture, priority: medium, when: {technologies_any: [iot, real_time_streaming]}}
- {id: warranty-early-warning, title: Combine warranty and telemetry for early warning, text: Blend claims and DTC trends and technician text to detect field issues earlier., category: business, priority: medium, sub_domains: [warranty_analytics]}
- {id: china-data-localisation, title: Keep China-collected vehicle data in China, text: Deploy a separate in-country data region and restrict cross-border transfers., category: architecture, priority: high, when: {geographies_any: [CN]}, decision_key: hosting_region, decision_option: in_country}
