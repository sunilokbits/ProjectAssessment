- {id: vehicle-privacy, title: "Connected vehicle and location data processed without valid consent", category: privacy, likelihood: 3, impact: 5, mitigation: "Market-specific consent capture, purpose limitation, pseudonymisation of VIN and location, and consent enforcement downstream.", sub_domains: [connected_vehicle, telematics, mobility_services], indicators: [location data, gps, driving behavior, consent, vin]}
- {id: vehicle-cyber, title: "Backend or OTA systems introduce vehicle cybersecurity exposure", category: security, likelihood: 3, impact: 5, mitigation: "Include backend in CSMS scope, threat analysis (TARA) per ISO/SAE 21434 and VSOC monitoring.", sub_domains: [connected_vehicle, product_engineering, telematics], indicators: [ota, r155, r156, tcu, vehicle backend]}
- {id: vin-linkage-gaps, title: "Data cannot be linked reliably by VIN", category: data, likelihood: 4, impact: 4, mitigation: "VIN validation and standardisation across systems; reference build data as the master.", indicators: [vin, vehicle id, chassis number]}
- {id: telemetry-cost-scale, title: "Telemetry volumes drive unexpected cost and performance issues", category: architecture, likelihood: 4, impact: 3, mitigation: "Edge filtering, signal prioritisation, tiered storage and FinOps monitoring.", sub_domains: [connected_vehicle, telematics, ev_battery], when: {technologies_any: [iot, real_time_streaming]}}
- {id: signal-inconsistency, title: "Inconsistent signal definitions across models and model years", category: data, likelihood: 4, impact: 3, mitigation: "Governed signal catalogue with versioning and unit normalisation.", sub_domains: [connected_vehicle, telematics], indicators: [signal, can, dbc, model year]}
- {id: late-recall-detection, title: "Field quality issues detected late leading to larger recalls", category: business, likelihood: 3, impact: 5, mitigation: "Early-warning analytics combining warranty, telemetry and text signals with clear escalation.", sub_domains: [warranty_analytics, aftersales], indicators: [recall, field issue, warranty trend, nhtsa]}
- {id: warranty-fraud, title: "Warranty claim fraud or leakage", category: financial, likelihood: 3, impact: 3, mitigation: "Claim anomaly detection by dealer and labour op; audit sampling.", sub_domains: [warranty_analytics, dealer_network], indicators: [warranty fraud, claim anomaly, goodwill]}
- {id: dealer-data-rights, title: "Limited rights or inconsistent access to dealer data", category: data, likelihood: 3, impact: 3, mitigation: "Review dealer agreements and use DMS-vendor certified integrations.", sub_domains: [dealer_network, aftersales], indicators: [dealer data, dms, dealer agreement]}
- {id: supply-disruption, title: "Part shortages disrupt production and deliveries", category: operational, likelihood: 3, impact: 5, mitigation: "Multi-tier supplier visibility, shortage early warning and scenario planning.", sub_domains: [supply_chain, vehicle_manufacturing], indicators: [shortage, semiconductor, supplier risk, line stop]}
- {id: production-line-impact, title: "Plant system changes disrupt vehicle production", category: operational, likelihood: 2, impact: 5, mitigation: "Read-only integration first, changes in planned shutdown windows with rollback.", sub_domains: [vehicle_manufacturing], indicators: [line stop, jph, mes, plant]}
- {id: data-act-obligations, title: "Unprepared for EU Data Act data access requests", category: compliance, likelihood: 3, impact: 4, mitigation: "Design data access APIs and contractual terms for users and third parties.", sub_domains: [connected_vehicle, telematics, aftersales], when: {geographies_any: [EU, EEA, DE, FR, IT, ES, NL, IE, SE, PL]}}
