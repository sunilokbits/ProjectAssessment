key: automotive
name: Automotive
kind: industry
version: 1.0.0
description: Vehicle OEMs, suppliers and mobility providers across vehicle manufacturing, connected vehicle, telematics, dealer network, supply chain, warranty and aftersales.
aliases: [auto, automaker, oem, automotive oem, tier 1 supplier, mobility, ev manufacturer]
sort_order: 55
sub_domains:
  - key: vehicle_manufacturing
    name: Vehicle Manufacturing
    description: Body, paint, assembly and powertrain plants including EV battery production.
    keywords: [vehicle assembly, body shop, paint shop, final assembly, powertrain, gigafactory, battery cell, jph, jobs per hour, vin]
  - key: connected_vehicle
    name: Connected Vehicle
    description: Vehicle connectivity, OTA updates, connected services and vehicle data platforms.
    keywords: [connected vehicle, connected car, ota, over-the-air, vehicle data, tcu, infotainment, software-defined vehicle, v2x, digital key]
  - key: telematics
    name: Telematics and Fleet
    description: Vehicle telemetry, fleet management, usage-based services and driver behaviour.
    keywords: [telematics, fleet management, can bus, obd, gps tracking, driver behavior, usage-based, vehicle telemetry, dtc, diagnostic trouble code]
  - key: dealer_network
    name: Dealer Network and Sales
    description: Dealer management, vehicle sales, inventory, financing and customer experience.
    keywords: [dealer, dealership, dms, dealer management system, vehicle sales, lead management, test drive, showroom, allocation, retail sales]
  - key: supply_chain
    name: Automotive Supply Chain
    description: Supplier management, inbound logistics, JIT/JIS sequencing and part shortages.
    keywords: [tier 1, tier 2, supplier, jit, jis, just in sequence, ppap, part shortage, inbound logistics, semiconductor shortage, edi delfor]
  - key: warranty_analytics
    name: Warranty and Quality Analytics
    description: Warranty claims, early warning, field quality and recall management.
    keywords: [warranty, warranty claim, field quality, early warning, recall, campaign, root cause, failure mode, defect trend, goodwill]
  - key: aftersales
    name: Aftersales and Service
    description: Service operations, parts, accessories and customer retention.
    keywords: [aftersales, service appointment, repair order, spare parts, parts distribution, service retention, workshop, technician]
  - key: product_engineering
    name: Product Engineering and R&D
    description: Vehicle development, simulation, testing, homologation and software engineering.
    keywords: [product engineering, vehicle development, homologation, simulation, validation testing, adas, autonomous driving, plm, aspice, iso 26262]
  - key: ev_battery
    name: EV and Battery
    description: Battery lifecycle, charging, battery health and battery passport.
    keywords: [electric vehicle, ev, battery, state of health, charging, battery passport, bms, battery management system, range]
  - key: mobility_services
    name: Mobility Services and Captive Finance
    description: Subscriptions, car sharing, leasing and captive finance.
    keywords: [mobility services, car sharing, subscription, leasing, captive finance, ride hailing, residual value]
