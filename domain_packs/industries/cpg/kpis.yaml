- {id: forecast-accuracy, name: Forecast accuracy, description: Accuracy of demand forecast at agreed level and lag (e.g. 1 - WMAPE)., unit: "%", direction: higher_is_better, category: operational, sub_domains: [demand_planning, supply_chain]}
- {id: forecast-bias, name: Forecast bias, description: Systematic over- or under-forecasting at agreed level and lag., unit: "%", direction: target_range, category: operational, sub_domains: [demand_planning]}
- {id: otif, name: On-time in-full, description: Share of customer orders delivered on time and in full., unit: "%", direction: higher_is_better, category: operational, sub_domains: [supply_chain, distribution]}
- {id: case-fill-rate, name: Case fill rate, description: Share of ordered cases shipped., unit: "%", direction: higher_is_better, category: operational, sub_domains: [supply_chain, distribution]}
- {id: trade-promotion-roi, name: Trade promotion ROI, description: Incremental gross profit relative to promotion investment., formula: incremental gross profit / trade investment, unit: ratio, direction: higher_is_better, category: financial, sub_domains: [trade_promotion, revenue_growth_management]}
- {id: trade-spend-ratio, name: Trade spend as share of gross sales, description: Trade investment relative to gross sales., unit: "%", direction: lower_is_better, category: financial, sub_domains: [trade_promotion, revenue_growth_management]}
- {id: market-share, name: Value market share, description: Brand share of category value sales., unit: "%", direction: higher_is_better, category: business, sub_domains: [consumer_analytics, sales_analytics]}
- {id: numeric-distribution, name: Numeric / weighted distribution, description: Share of outlets (or weighted category sales) stocking the product., unit: "%", direction: higher_is_better, category: business, sub_domains: [distribution, sales_analytics]}
- {id: days-inventory, name: Days of inventory, description: Days of finished-goods inventory on hand relative to demand., unit: days, direction: target_range, category: operational, sub_domains: [supply_chain, demand_planning]}
- {id: net-revenue-growth, name: Net revenue growth, description: Growth in net revenue after trade spend., unit: "%", direction: higher_is_better, category: financial}
- {id: deduction-resolution-time, name: Deduction resolution time, description: Average days to resolve customer deductions., unit: days, direction: lower_is_better, category: financial, sub_domains: [trade_promotion]}
- {id: perfect-store-score, name: Perfect store score, description: "Compliance with distribution, shelf, pricing and promotion standards in audited outlets.", unit: score, direction: higher_is_better, category: business, sub_domains: [sales_analytics, distribution]}
