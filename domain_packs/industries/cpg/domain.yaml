key: cpg
name: Consumer Packaged Goods
kind: industry
version: 1.0.0
description: Consumer packaged goods / FMCG manufacturers covering demand planning, trade promotion, sales and distribution, supply chain, revenue growth management and consumer analytics.
aliases: [CPG, FMCG, consumer goods, fast-moving consumer goods, consumer products, food and beverage, personal care, household products]
sort_order: 45
sub_domains:
  - key: demand_planning
    name: Demand Planning and S&OP
    description: Statistical forecasting, consensus demand planning and sales and operations planning.
    keywords: [demand planning, demand forecast, s&op, sales and operations planning, ibp, integrated business planning, consensus forecast, forecast accuracy, demand sensing]
  - key: trade_promotion
    name: Trade Promotion Management and Optimisation
    description: Trade spend planning, promotion execution, deductions and post-event analysis.
    keywords: [trade promotion, tpm, tpo, trade spend, promotion roi, deductions, claims settlement, accruals, retailer promotion, trade funds]
  - key: revenue_growth_management
    name: Revenue Growth Management
    description: Pricing, pack-price architecture, mix and promotion strategy.
    keywords: [revenue growth management, rgm, price pack architecture, net revenue management, price elasticity, mix management, list price]
  - key: sales_analytics
    name: Sales Analytics and Key Account Management
    description: Sell-in and sell-out analytics, key account plans and retail execution.
    keywords: [sell-in, sell-out, key account management, retail execution, perfect store, field sales, secondary sales, primary sales, account plan]
  - key: distribution
    name: Distribution and Route-to-Market
    description: Distributor management, DMS, general trade, van sales and route-to-market.
    keywords: [distributor, distributor management system, dms, route to market, general trade, modern trade, van sales, beat plan, outlet coverage, numeric distribution]
  - key: supply_chain
    name: Supply Chain and Logistics
    description: Supply planning, procurement, manufacturing, warehousing and transportation.
    keywords: [supply planning, procurement, co-manufacturer, warehousing, transportation, otif, fill rate, logistics, inventory optimization, control tower]
  - key: consumer_analytics
    name: Consumer Analytics and Insights
    description: Consumer research, panel data, social listening and brand health.
    keywords: [consumer insights, consumer panel, nielsen, circana, kantar, brand health, social listening, market share, household penetration, consumer research]
  - key: marketing_analytics
    name: Marketing and Media Analytics
    description: Marketing mix modelling, media effectiveness and first-party data.
    keywords: [marketing mix modeling, mmm, media effectiveness, brand marketing, first-party data, digital marketing, attribution, media spend]
  - key: ecommerce_d2c
    name: E-commerce and Direct-to-Consumer
    description: Marketplace, quick commerce, retailer.com and direct-to-consumer channels.
    keywords: [d2c, direct to consumer, digital shelf, amazon vendor central, quick commerce, retailer.com, content syndication, ratings and reviews]
  - key: product_lifecycle
    name: Product Innovation and Lifecycle
    description: New product development, formulation, packaging and regulatory labelling.
    keywords: [new product development, npd, formulation, packaging, plm, product lifecycle, label compliance, sustainability, recyclable packaging]
