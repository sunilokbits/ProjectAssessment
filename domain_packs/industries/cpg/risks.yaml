- {id: hierarchy-misalignment, title: "Product and customer hierarchies cannot be harmonised across data sources", category: data, likelihood: 4, impact: 4, mitigation: "Establish product and customer MDM with external code mappings (GTIN, retailer item, syndicated codes).", indicators: [mapping table, hierarchy, gtin, item code, master data]}
- {id: data-licence-breach, title: "Syndicated or retailer data used outside licence terms", category: compliance, likelihood: 3, impact: 4, mitigation: "Review licences, tag data with permitted uses and restrict access accordingly.", indicators: [nielsen, circana, iri, kantar, retail link, syndicated data]}
- {id: trade-spend-leakage, title: "Trade spend leakage and unresolved deductions", category: financial, likelihood: 3, impact: 4, mitigation: "Link accruals, deductions and promotion performance at event level and automate deduction matching.", sub_domains: [trade_promotion, revenue_growth_management], indicators: [deductions, trade spend, accruals, claims]}
- {id: forecast-adoption, title: "Planners override or ignore model forecasts", category: business, likelihood: 4, impact: 3, mitigation: "Measure forecast value-add, explain drivers and embed outputs in planning tools.", sub_domains: [demand_planning], when: {technologies_any: [machine_learning, advanced_analytics]}}
- {id: sellout-latency, title: "Late or incomplete sell-out and distributor data", category: data, likelihood: 4, impact: 3, mitigation: "Agree data SLAs with retailers and distributors and impute or flag gaps.", indicators: [sell-out, secondary sales, distributor data, pos data]}
- {id: calendar-mismatch, title: "Mismatched fiscal, retailer and syndicated calendars distort analysis", category: data, likelihood: 3, impact: 3, mitigation: "Build a conformed calendar dimension with mapping rules for each source.", indicators: [4-4-5, fiscal week, retailer week, calendar]}
- {id: competition-law, title: "Competition-law exposure from sharing pricing or promotion data", category: compliance, likelihood: 2, impact: 5, mitigation: "Legal review of data-sharing arrangements; aggregate and anonymise competitive data.", sub_domains: [revenue_growth_management, trade_promotion, sales_analytics], indicators: [competitor pricing, price sharing, retailer collaboration]}
- {id: supply-disruption-visibility, title: "Limited visibility of supply disruptions across co-manufacturers and suppliers", category: operational, likelihood: 3, impact: 4, mitigation: "Supply chain control tower with supplier and co-man data integration.", sub_domains: [supply_chain], indicators: [co-manufacturer, supplier, disruption, stock-out, otif]}
- {id: consumer-privacy, title: "Consumer data collected without valid consent", category: privacy, likelihood: 2, impact: 4, mitigation: "Consent management for D2C and loyalty data; use clean rooms for retailer collaboration.", sub_domains: [consumer_analytics, ecommerce_d2c, marketing_analytics], indicators: [consumer data, first-party data, loyalty, email]}
- {id: sap-extraction-constraints, title: "SAP extraction licensing or performance constraints", category: integration, likelihood: 3, impact: 3, mitigation: "Confirm SAP licensing for extraction (ODP / Datasphere) and agree extraction windows.", when: {technologies_any: [sap_integration]}, indicators: [sap, ecc, s/4hana, bw]}
