- {id: mdm-first, title: Prioritise product and customer master data harmonisation, text: "Fund MDM and external code mapping (GTIN, retailer items, syndicated codes) as a first-phase deliverable.", category: data, priority: high}
- {id: licence-review, title: Review syndicated and retailer data licences before ingestion, text: Confirm permitted uses and hosting and tag data so access policies enforce licence terms., category: governance, priority: high}
- {id: forecast-value-add, title: Measure forecast value-add from day one, text: Baseline current accuracy and bias and track model versus planner overrides to drive adoption., category: business, priority: high, when: {project_types_any: [demand_forecasting]}}
- {id: embed-in-planning, title: Embed outputs in planning and TPM tools, text: Write forecasts and promotion recommendations back to the tools planners and KAMs already use., category: integration, priority: medium, sub_domains: [demand_planning, trade_promotion]}
- {id: conformed-calendar, title: Build a conformed calendar dimension, text: Map fiscal and retailer weeks and syndicated periods to one calendar to avoid misaligned comparisons., category: data, priority: medium}
- {id: sap-certified-extraction, title: Use SAP-supported extraction methods, text: Use ODP-based or SAP Datasphere extraction rather than direct table reads to remain within licence and support terms., category: integration, priority: medium, when: {technologies_any: [sap_integration]}, decision_key: sap_extraction_method, decision_option: sap_supported_odp}
