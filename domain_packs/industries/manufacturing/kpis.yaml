- {id: oee, name: Overall equipment effectiveness (OEE), description: Composite of availability performance and quality for equipment or lines., formula: availability x performance x quality, unit: "%", direction: higher_is_better, category: operational}
- {id: unplanned-downtime, name: Unplanned downtime, description: Hours of unplanned stoppage per period or asset., unit: hours, direction: lower_is_better, category: operational}
- {id: yield, name: Yield, description: Good output relative to input or theoretical output., formula: good output / total input, unit: "%", direction: higher_is_better, category: quality}
- {id: first-pass-yield, name: First pass yield, description: Share of units produced correctly without rework., unit: "%", direction: higher_is_better, category: quality, sub_domains: [quality, discrete_manufacturing]}
- {id: scrap-rate, name: Scrap rate, description: Share of material or units scrapped., formula: scrapped units / total units produced, unit: "%", direction: lower_is_better, category: quality}
- {id: cycle-time, name: Cycle time, description: Time to complete one unit or operation., unit: seconds, direction: lower_is_better, category: operational, sub_domains: [discrete_manufacturing, smart_factory, production_planning]}
- {id: mtbf, name: Mean time between failures, description: Average operating time between equipment failures., unit: hours, direction: higher_is_better, category: maintenance, sub_domains: [predictive_maintenance]}
- {id: mttr, name: Mean time to repair, description: Average time to restore equipment after failure., unit: hours, direction: lower_is_better, category: maintenance, sub_domains: [predictive_maintenance]}
- {id: schedule-adherence, name: Schedule adherence, description: Share of production orders completed as scheduled., unit: "%", direction: higher_is_better, category: operational, sub_domains: [production_planning]}
- {id: planned-maintenance-ratio, name: Planned maintenance percentage, description: Share of maintenance hours that are planned rather than reactive., unit: "%", direction: higher_is_better, category: maintenance, sub_domains: [predictive_maintenance]}
- {id: energy-intensity, name: Energy intensity, description: Energy consumed per unit of output., unit: kWh per unit, direction: lower_is_better, category: sustainability, sub_domains: [energy_sustainability, process_manufacturing]}
- {id: trir, name: Total recordable incident rate, description: Recordable safety incidents per 200000 hours worked., unit: rate, direction: lower_is_better, category: safety, sub_domains: [ehs]}
