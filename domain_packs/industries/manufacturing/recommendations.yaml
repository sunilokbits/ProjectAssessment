- {id: read-only-first, title: Start with read-only OT integration, text: Deliver value from read-only data before any closed-loop or write-back to plant systems; apply MOC for later phases., category: architecture, priority: high, decision_key: ot_write_access, decision_option: read_only_first}
- {id: ot-security-62443, title: Align OT connectivity to ISA/IEC 62443, text: "Route data through an OT DMZ with defined zones and conduits, secure remote access and OT monitoring.", category: security, priority: high}
- {id: asset-model-template, title: Build a reusable ISA-95 asset model and tag template, text: Standardise asset hierarchy and tag naming so pilots scale across lines and plants., category: data, priority: high}
- {id: lighthouse-line, title: Pilot on a lighthouse line with a scale-up plan, text: Select a representative line with engaged plant leadership and define multi-plant rollout criteria up front., category: delivery, priority: medium, decision_key: delivery_approach, decision_option: pilot_then_scale}
- {id: edge-buffering, title: Use edge buffering for plant connectivity, text: Deploy edge gateways with store-and-forward so plant outages do not lose data or affect production., category: architecture, priority: medium, when: {technologies_any: [iot, real_time_streaming]}}
- {id: improve-failure-coding, title: Improve CMMS failure coding alongside predictive models, text: Standardise failure modes and work order closure data to improve model training over time., category: data, priority: medium, when: {project_types_any: [predictive_maintenance]}}
