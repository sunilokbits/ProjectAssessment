key: manufacturing
name: Manufacturing
kind: industry
version: 1.0.0
description: Discrete and process manufacturing including smart factory, industrial IoT, predictive maintenance, quality, production planning and plant operations.
aliases: [manufacturer, industrial, factory, plant operations, industry 4.0, smart manufacturing]
sort_order: 50
sub_domains:
  - key: discrete_manufacturing
    name: Discrete Manufacturing
    description: Assembly-based production of distinct units (machinery, electronics, aerospace components, equipment).
    keywords: [discrete manufacturing, assembly line, machining, cnc, work cell, engineer to order, make to order, serial number, routing]
  - key: process_manufacturing
    name: Process Manufacturing
    description: Batch and continuous production (chemicals, food, metals, paper, plastics).
    keywords: [process manufacturing, batch process, continuous process, recipe, formulation, chemicals, refinery, dcs, process control, yield loss]
  - key: smart_factory
    name: Smart Factory and Industry 4.0
    description: Digitised plants with MES, connected assets, digital twins and automation.
    keywords: [smart factory, industry 4.0, digital twin, mes, manufacturing execution system, connected worker, automation, lights-out, unified namespace]
  - key: industrial_iot
    name: Industrial IoT
    description: Sensor and machine connectivity, edge computing and time-series data.
    keywords: [industrial iot, iiot, sensor data, plc, scada, opc ua, mqtt, historian, edge gateway, time series, telemetry]
  - key: predictive_maintenance
    name: Predictive Maintenance and Asset Management
    description: Condition monitoring, failure prediction and maintenance planning.
    keywords: [predictive maintenance, condition monitoring, vibration analysis, asset health, cmms, eam, failure prediction, mtbf, mttr, reliability]
  - key: quality
    name: Quality Management
    description: Inspection, SPC, non-conformance, CAPA and traceability.
    keywords: [quality control, quality inspection, spc, statistical process control, non-conformance, ncr, capa, first pass yield, defect, vision inspection, traceability]
  - key: production_planning
    name: Production Planning and Scheduling
    description: MRP, capacity planning, finite scheduling and shop-floor control.
    keywords: [production planning, production scheduling, mrp, aps, capacity planning, master production schedule, finite scheduling, shop floor control]
  - key: supply_chain
    name: Manufacturing Supply Chain
    description: Procurement, supplier quality, inbound logistics and inventory.
    keywords: [supplier quality, procurement, inbound logistics, raw materials, wip inventory, kanban, just in time, supplier collaboration]
  - key: energy_sustainability
    name: Energy and Sustainability
    description: Energy monitoring, emissions tracking and resource efficiency.
    keywords: [energy management, energy consumption, emissions, carbon footprint, iso 50001, scope 1, scope 2, sustainability]
  - key: ehs
    name: Environment, Health and Safety
    description: Worker safety, incident management and environmental compliance.
    keywords: [ehs, health and safety, safety incident, near miss, lockout tagout, osha, permit to work, hazard]
  - key: aftermarket_service
    name: Aftermarket and Field Service
    description: Service parts, field service and installed-base management.
    keywords: [aftermarket, field service, service parts, installed base, warranty, service contract, remote monitoring]
