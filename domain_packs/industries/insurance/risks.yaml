- {id: policyholder-data-exposure, title: Policyholder PII and health data exposure, category: security, likelihood: 3, impact: 5, mitigation: "Classify data, mask/tokenise PII and medical attributes, enforce row/column-level security and access monitoring.", indicators: [pii, policyholder data, medical records, health information, ssn, aadhaar, date of birth]}
- {id: actuarial-reconciliation, title: "Premium, claims or reserve figures do not reconcile with finance and actuarial records", category: data, likelihood: 3, impact: 5, mitigation: "Design reconciliation controls for written/earned premium, paid/incurred claims and reserves; sign-off with actuarial and finance.", indicators: [reconciliation, reserves, earned premium, incurred, general ledger]}
- {id: ifrs17-solvency-impact, title: IFRS 17 / solvency reporting affected by data or logic changes, category: compliance, likelihood: 3, impact: 5, mitigation: "Parallel-run IFRS 17 and solvency outputs; maintain contract-group lineage and audit trail.", indicators: [ifrs 17, solvency ii, qrt, rbc, csm, statutory reporting]}
- {id: legacy-product-mapping, title: Inconsistent legacy product and coverage codes, category: data, likelihood: 4, impact: 3, mitigation: "Build a governed product/coverage mapping with actuarial sign-off before migration.", indicators: [legacy product, product code, mainframe, closed book]}
- {id: claims-leakage, title: Claims leakage or fraud undetected by new process, category: business, likelihood: 3, impact: 4, mitigation: "Embed fraud scoring and SIU referral in the new claims flow; track leakage KPIs.", sub_domains: [claims, health_insurance, property_casualty, general_insurance], indicators: [fraud, leakage, siu, staged accident]}
- {id: unfair-ai-decisions, title: Unfair or unexplainable automated underwriting or claims decisions, category: compliance, likelihood: 3, impact: 5, mitigation: "Bias testing, explainability, human-in-the-loop for adverse decisions and documented model governance.", when: {technologies_any: [machine_learning, generative_ai, agentic_ai, ai_agents, advanced_analytics]}}
- {id: medical-data-misuse, title: Health information used beyond permitted purpose, category: privacy, likelihood: 2, impact: 5, mitigation: "Purpose-limit medical data, separate health data zones and enforce consent rules.", sub_domains: [health_insurance, life_insurance, underwriting, claims], indicators: [medical, health data, diagnosis, hospital]}
- {id: broker-data-quality, title: Poor-quality broker and bordereaux data, category: data, likelihood: 4, impact: 3, mitigation: "Standardise on ACORD formats, validate bordereaux on receipt and feed back errors to partners.", sub_domains: [distribution, reinsurance, property_casualty], indicators: [bordereaux, broker, spreadsheet, mga]}
- {id: cat-exposure-gaps, title: Incomplete exposure data undermines catastrophe and reinsurance decisions, category: data, likelihood: 3, impact: 4, mitigation: "Geocode and enrich exposure data; define minimum exposure data standards.", sub_domains: [property_casualty, reinsurance], indicators: [catastrophe, cat model, exposure, geocoding]}
- {id: cloud-outsourcing-approval, title: Cloud / outsourcing regulatory approval delays, category: compliance, likelihood: 3, impact: 4, mitigation: "Start outsourcing risk assessment and regulator notification early.", when: {technologies_any: [azure, aws, gcp, databricks, snowflake, microsoft_fabric, cloud_migration]}}
- {id: legacy-admin-extract, title: Legacy policy administration extract constraints, category: integration, likelihood: 4, impact: 3, mitigation: "Agree extract windows and formats with system owners; evaluate CDC or vendor data APIs.", indicators: [mainframe, as400, cobol, legacy admin, green screen]}
