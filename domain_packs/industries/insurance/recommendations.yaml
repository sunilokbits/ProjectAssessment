- {id: parallel-run-actuarial, title: Parallel-run actuarial and regulatory outputs before cut-over, text: "Run legacy and new IFRS 17, solvency and statutory outputs in parallel for at least one reporting cycle and reconcile differences.", category: delivery, priority: high, decision_key: delivery_approach, decision_option: phased_parallel_run, rationale: Actuarial and regulatory figures cannot tolerate unreconciled differences.}
- {id: product-mapping-first, title: Establish a governed product and coverage mapping early, text: Agree a canonical line-of-business and coverage hierarchy with actuarial and finance before building marts., category: data, priority: high}
- {id: human-in-loop-claims, title: Keep humans in the loop for adverse AI claim and underwriting decisions, text: "Use AI for triage and recommendations; require human review for declines, reductions and fraud referrals.", category: governance, priority: high, when: {technologies_any: [machine_learning, generative_ai, agentic_ai, ai_agents]}}
- {id: segregate-health-data, title: Segregate and purpose-limit health information, text: Store medical data in a separate zone with stricter access and consent enforcement., category: security, priority: high, when: {any_of: [{data_classifications_any: [phi, spi]}, {sub_domains_any: [health_insurance, life_insurance]}]}}
- {id: acord-standardisation, title: Standardise partner data exchange on ACORD, text: Adopt ACORD formats for broker and bordereaux feeds with validation at ingestion., category: integration, priority: medium, when: {sub_domains_any: [distribution, reinsurance, property_casualty, general_insurance]}}
- {id: in-country-hosting-insurance, title: Host policyholder data in-country where required, text: Select in-country cloud regions where local insurance or data protection regulation requires it., category: architecture, priority: medium, when: {geographies_any: [IN]}, decision_key: hosting_region, decision_option: in_country}
