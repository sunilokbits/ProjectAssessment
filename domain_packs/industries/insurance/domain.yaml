    coverage: 1
business_processes:
  - "Product design and filing"
  - "Quote and new business"
  - "Underwriting and risk selection"
  - "Policy issuance and servicing"
  - "Premium billing and collections"
  - "Renewals and lapse management"
  - "First notice of loss"
  - "Claims adjudication and settlement"
  - "Subrogation and recoveries"
  - "Reinsurance ceding and bordereaux"
  - "Actuarial reserving and pricing"
  - "Regulatory and statutory reporting"
  - "Agent and broker commission management"
  - "Fraud investigation"
capabilities:
  - "Policyholder 360"
  - "Underwriting decision support"
  - "Pricing and rating analytics"
  - "Claims triage and automation"
  - "Claims fraud detection"
  - "Loss reserving and IFRS 17 reporting"
  - "Solvency and capital reporting"
  - "Catastrophe exposure management"
  - "Distribution performance analytics"
  - "Retention and lapse prediction"
  - "Document intelligence for claims and proposals"
source_systems:
  - "Policy administration (Guidewire PolicyCenter, Duck Creek Policy, Sapiens, Majesco, EIS, Ebix)"
  - "Claims system (Guidewire ClaimCenter, Duck Creek Claims, Sapiens ClaimsPro)"
  - "Billing (Guidewire BillingCenter, Duck Creek Billing)"
  - "Life admin (FAST, Oracle Insurance Policy Administration, LifePRO, Ingenium)"
  - "Rating engines"
  - "Reinsurance system (SAP FS-RI, Sapiens Reinsurance)"
  - "Actuarial tools (Moody's AXIS, Prophet, WTW ResQ, Igloo)"
  - "IFRS 17 engines (SAP FPSL, Moody's, Aptitude)"
  - "Catastrophe models (Verisk/AIR, Moody's RMS)"
  - "Agent portal and CRM (Salesforce Financial Services Cloud)"
  - "Document management and imaging"
  - "General ledger"
data_entities:
  - "Policyholder"
  - "Insured"
  - "Policy"
  - "Coverage"
