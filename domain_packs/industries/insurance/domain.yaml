  - "Product"
  - "Beneficiary"
  - "Exposure"
integration_patterns:
  - "ACORD XML / ACORD AL3 messaging"
  - "Batch policy and claims extracts"
  - "CDC from policy administration systems"
  - "Broker and aggregator APIs"
  - "Bordereaux file exchange"
  - "Third-party data enrichment APIs (MVR, credit, property, medical)"
  - "Document / image ingestion"
related_technologies: [databricks, snowflake, power_bi, machine_learning, generative_ai, data_governance, salesforce_integration]
related_project_types: [customer_360, fraud_detection, regulatory_reporting, document_intelligence, churn_prediction, data_platform_modernization]
