key: insurance
name: Insurance
kind: industry
version: 1.0.0
description: Life, health, general and property and casualty insurance, reinsurance, claims, underwriting, policy administration, distribution and actuarial functions.
aliases: [insurer, insurance company, assurance, insurtech, carrier]
sort_order: 20
sub_domains:
  - key: life_insurance
    name: Life Insurance
    description: Term, whole life, endowment, ULIP, annuities and pensions.
    keywords: [life insurance, term life, whole life, endowment, ulip, annuity, pension, mortality, policyholder, sum assured, surrender value]
  - key: health_insurance
    name: Health Insurance
    description: Individual and group health, medical indemnity and TPA operations.
    keywords: [health insurance, medical insurance, mediclaim, group health, tpa, cashless, network hospital, pre-authorization, health plan]
  - key: general_insurance
    name: General Insurance
    description: Non-life lines such as motor, travel, marine, liability and SME packages.
    keywords: [general insurance, non-life, motor insurance, travel insurance, marine insurance, liability insurance, sme package]
  - key: property_casualty
    name: Property and Casualty
    description: Personal and commercial property, casualty, workers compensation and specialty lines.
    keywords: [property and casualty, p&c, homeowners, commercial property, casualty, workers compensation, auto insurance, catastrophe, cat modelling, specialty lines]
  - key: reinsurance
    name: Reinsurance
    description: Treaty and facultative reinsurance, retrocession and bordereaux management.
    keywords: [reinsurance, treaty, facultative, retrocession, ceded, cedant, bordereaux, quota share, excess of loss, reinsurer]
  - key: claims
    name: Claims
    description: First notice of loss through adjudication, settlement, recovery and litigation.
    keywords: [claims, fnol, first notice of loss, claim adjuster, loss adjuster, claim settlement, subrogation, salvage, claims leakage, reserving]
  - key: underwriting
    name: Underwriting
    description: Risk selection, rating, pricing and acceptance of new and renewal business.
    keywords: [underwriting, underwriter, risk selection, rating engine, premium rating, medical underwriting, risk appetite, quote, binding authority]
  - key: policy_administration
    name: Policy Administration
    description: Policy issuance, endorsements, renewals, billing and lapse management.
    keywords: [policy administration, policy issuance, endorsement, renewal, premium billing, lapse, reinstatement, policy servicing]
  - key: distribution
    name: Distribution and Channels
    description: Agency, broker, bancassurance, direct and digital aggregator channels.
    keywords: [agent, agency, broker, bancassurance, aggregator, commission, intermediary, distribution channel, mga]
  - key: actuarial
    name: Actuarial and Finance
    description: Reserving, pricing models, capital modelling and IFRS 17 / Solvency reporting.
    keywords: [actuarial, reserving, ibnr, loss triangle, ifrs 17, solvency ii, capital model, embedded value, contractual service margin, csm]
  - key: insurtech
    name: InsurTech and Embedded Insurance
    description: Digital-first carriers, usage-based insurance and embedded insurance partnerships.
    keywords: [insurtech, embedded insurance, usage-based insurance, ubi, telematics insurance, parametric insurance, digital insurer]
