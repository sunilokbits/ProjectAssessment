system_addition: |
  Use e-commerce terminology (customer, session, product, SKU, listing, seller, order, GMV, AOV, chargeback, PSP).
  Highlight PCI DSS scope minimisation, consent for tracking, bot filtering, identity stitching, order-to-settlement reconciliation,
  marketplace seller verification and peak trading resilience.
stage_additions:
