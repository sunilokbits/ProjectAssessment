- {id: pci-scope-creep, title: Analytics systems pulled into PCI DSS scope, category: security, likelihood: 3, impact: 5, mitigation: "Use hosted payment fields and PSP tokens; never log PAN in clickstream or app logs.", indicators: [card number, pan, checkout logs, payment form]}
- {id: consent-noncompliance, title: Tracking without valid consent, category: privacy, likelihood: 4, impact: 4, mitigation: "Consent management platform integrated with tag management and server-side tracking.", indicators: [cookies, tracking pixel, consent banner, third-party tags]}
- {id: bot-traffic, title: Bot traffic distorts analytics and models, category: data, likelihood: 4, impact: 3, mitigation: "Filter bots at collection and in pipelines; monitor anomalous sessions.", indicators: [bot, scraping, invalid traffic]}
- {id: payment-fraud, title: Payment fraud and chargebacks rise, category: security, likelihood: 3, impact: 4, mitigation: "Layered fraud scoring, 3DS where appropriate, chargeback feedback loops.", sub_domains: [payments_checkout, marketplace], indicators: [chargeback, fraud, account takeover, promo abuse]}
- {id: seller-fraud, title: Fraudulent or non-compliant sellers, category: compliance, likelihood: 3, impact: 4, mitigation: "Seller KYB verification, listing moderation and performance monitoring.", sub_domains: [marketplace, seller_management], indicators: [counterfeit, seller fraud, fake listings]}
- {id: peak-outage, title: Platform failure during peak trading, category: architecture, likelihood: 3, impact: 5, mitigation: "Load test, autoscale and freeze changes before peak events.", indicators: [black friday, peak traffic, flash sale]}
- {id: catalogue-quality-risk, title: Poor catalogue data degrades search and recommendations, category: data, likelihood: 4, impact: 3, mitigation: "PIM governance and AI-assisted attribute enrichment with review.", sub_domains: [search_discovery, marketplace, seller_management], indicators: [missing attributes, catalogue, product data]}
- {id: revenue-reconciliation, title: Orders and settlements do not reconcile, category: data, likelihood: 3, impact: 4, mitigation: "Daily reconciliation of orders, PSP settlements, refunds and payouts.", sub_domains: [payments_checkout, marketplace], indicators: [settlement, reconciliation, payout]}
- {id: dark-patterns, title: Personalisation or pricing judged as dark patterns, category: compliance, likelihood: 2, impact: 4, mitigation: "Review against consumer protection guidance; avoid manipulative design.", indicators: [dynamic pricing, urgency messaging, drip pricing]}
