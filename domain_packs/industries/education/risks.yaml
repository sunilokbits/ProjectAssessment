- {id: ferpa-violation, title: Disclosure of education records in breach of FERPA, category: compliance, likelihood: 3, impact: 5, mitigation: "Establish school-official agreements, role-based access and directory-information opt-out handling.", indicators: [ferpa, education record, transcript, grades]}
- {id: childrens-data, title: Children's data processed without required consent, category: privacy, likelihood: 3, impact: 5, mitigation: "Apply COPPA / age-appropriate design controls; obtain verifiable parental or school consent.", sub_domains: [schools, edtech], indicators: [coppa, under 13, children, pupil, parental consent]}
- {id: inconsistent-definitions, title: Conflicting academic metric definitions, category: data, likelihood: 4, impact: 3, mitigation: "Agree a governed data dictionary for retention, FTE and completion with institutional research.", indicators: [retention rate, fte, census, headcount]}
- {id: academic-calendar-clash, title: Cut-over clashes with enrolment or exam periods, category: delivery, likelihood: 3, impact: 4, mitigation: "Plan releases around the academic calendar and freeze windows.", indicators: [enrolment period, exam period, term start, clearing]}
- {id: decentralised-it, title: Decentralised faculty systems and shadow IT, category: integration, likelihood: 4, impact: 3, mitigation: "Inventory faculty-level systems early; agree federated ownership.", indicators: [faculty system, department database, shadow it, spreadsheets]}
- {id: analytics-stigma, title: Predictive student risk scores cause stigma or bias, category: ethics, likelihood: 3, impact: 4, mitigation: "Use risk scores for supportive outreach only; test for bias across demographic groups.", sub_domains: [student_analytics, higher_education], indicators: [at-risk, early alert, predictive model, dropout]}
- {id: research-data-restrictions, title: Research data used beyond sponsor or ethics approvals, category: compliance, likelihood: 2, impact: 4, mitigation: "Track data use agreements and IRB approvals as metadata; enforce access by project.", sub_domains: [research], indicators: [irb, data use agreement, sponsor, cui]}
- {id: funding-constraints, title: Budget constraints and grant-funded timelines, category: business, likelihood: 3, impact: 3, mitigation: "Phase delivery to fiscal-year funding and demonstrate early wins.", indicators: [budget cut, grant funded, fiscal year, funding]}
