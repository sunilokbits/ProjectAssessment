- id: mine-ot-segmentation
  text: How will data from fleet, plant control and safety systems leave the mine OT network without compromising segmentation?
  category: security
  dimension: safety_environment_controls
  answer_type: single_choice
  critical: true
  options:
    - {value: unknown, label: Not yet defined, score: 0}
    - {value: direct, label: Direct connections from OT systems, score: 0.1}
    - {value: dmz_planned, label: Industrial DMZ planned, score: 0.5}
    - {value: dmz_in_place, label: Industrial DMZ with one-way replication in place, score: 1}
- id: value-chain-reconciliation
  text: Is there a mine-to-mill reconciliation process linking resource model, mined tonnes, plant feed and production?
  category: data
  dimension: mine_operations_data
  answer_type: single_choice
  weight: 1.5
  sub_domains: [extraction_operations, processing, exploration]
  options:
    - {value: none, label: No systematic reconciliation, score: 0.1}
    - {value: monthly_manual, label: Monthly manual reconciliation, score: 0.5}
    - {value: automated, label: Automated reconciliation with factors tracked, score: 1}
- id: fleet-data-access
  text: Which fleet management, dispatch and OEM telematics systems are in use, and can raw cycle and health data be accessed?
