- {id: saidi, name: SAIDI, description: "System Average Interruption Duration Index - average outage minutes per customer.", unit: minutes, direction: lower_is_better, category: operational, sub_domains: [electricity, grid_analytics]}
- {id: saifi, name: SAIFI, description: "System Average Interruption Frequency Index - average interruptions per customer.", unit: count, direction: lower_is_better, category: operational, sub_domains: [electricity, grid_analytics]}
- {id: non-revenue-water, name: Non-revenue water, description: Share of water produced that is not billed., formula: "(system input volume - billed authorised consumption) / system input volume", unit: "%", direction: lower_is_better, category: operational, sub_domains: [water]}
- {id: meter-read-rate, name: Meter read success rate, description: Share of expected interval reads received and validated on time., unit: "%", direction: higher_is_better, category: data, sub_domains: [smart_metering]}
- {id: asset-availability, name: Asset availability, description: Share of time critical assets are available for service., unit: "%", direction: higher_is_better, category: operational, sub_domains: [asset_management, renewable_energy, oil_gas, electricity]}
- {id: unplanned-downtime, name: Unplanned downtime, description: Hours of unplanned equipment downtime per period., unit: hours, direction: lower_is_better, category: operational}
- {id: forecast-accuracy, name: Load forecast accuracy, description: "Accuracy of load or generation forecasts (e.g. MAPE).", unit: "%", direction: lower_is_better, category: analytics, sub_domains: [grid_analytics, electricity, renewable_energy]}
- {id: capacity-factor, name: Capacity factor, description: Actual generation relative to maximum possible generation., unit: "%", direction: higher_is_better, category: operational, sub_domains: [renewable_energy, electricity]}
- {id: cost-to-serve, name: Cost to serve, description: Operating cost per customer served., unit: currency, direction: lower_is_better, category: business}
- {id: emissions-intensity, name: Emissions intensity, description: Greenhouse gas emissions per unit of energy produced., unit: tCO2e/MWh, direction: lower_is_better, category: esg}
