system_addition: |
  Use energy and utilities terminology (service point, meter, interval read, feeder, asset, outage, historian).
  Treat OT/IT segmentation and critical-infrastructure security (NERC CIP, NIS2, IEC 62443) as first-order concerns.
  Distinguish advisory analytics from closed-loop control and never assume a safety case exists.
stage_additions:
  discovery: Ask which OT systems, asset registers, meter data and regulator submissions the project touches.
  solutioning: Show how OT data reaches the platform without inbound connectivity into control networks.
extraction_hints: Map "premise", "MPAN", "ICP" and "delivery point" to Service Point; map "tag" and "point" to sensor readings in the historian.
