- {id: one-way-ot-replication, title: Use one-way replication out of OT networks, text: "Replicate OT data through an industrial DMZ or data diode; no inbound paths into control networks.", category: security, priority: high, rationale: Protects critical infrastructure and simplifies NERC CIP / NIS2 scope.}
- {id: asset-context-first, title: Establish the asset hierarchy before advanced analytics, text: "Map historian tags and sensors to the EAM/GIS asset hierarchy for priority asset classes first.", category: data, priority: high, sub_domains: [asset_management, electricity, water, oil_gas, renewable_energy]}
- {id: cip-classification, title: Classify BES Cyber System Information early, text: "Engage the NERC CIP compliance team to classify data before choosing hosting locations.", category: compliance, priority: high, when: {geographies_any: [US, CA], sub_domains_any: [electricity, grid_analytics, renewable_energy]}}
- {id: meter-data-partitioning, title: Design interval data storage for scale, text: "Partition interval reads by date and service point; keep raw and VEE-validated reads separately.", category: architecture, priority: medium, sub_domains: [smart_metering]}
- {id: advisory-first, title: Start with advisory analytics, text: "Deliver forecasts and alerts to operators as decision support before any closed-loop automation.", category: delivery, priority: medium, decision_key: ot_automation_level, decision_option: advisory}
