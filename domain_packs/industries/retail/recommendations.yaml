- {id: product-master-first, title: Establish a governed product master early, text: Align SKU hierarchy and key attributes across channels before building analytics and AI on top., category: data, priority: high}
- {id: peak-freeze, title: Plan cut-over around peak trading freezes, text: Schedule releases and cut-over outside peak trading and conduct load tests at peak volumes., category: delivery, priority: high}
- {id: tokenise-at-capture, title: Keep cardholder data out of analytics, text: Tokenise payment data at capture so analytics platforms remain out of PCI DSS scope., category: security, priority: high, when: {data_classifications_any: [cardholder]}}
- {id: consent-driven-personalisation, title: Drive personalisation from consent and preference data, text: Connect consent management to CDP and activation channels so personalisation honours opt-outs., category: governance, priority: high, when: {any_of: [{project_types_any: [customer_360, recommendation_engine]}, {sub_domains_any: [customer_loyalty, recommendation_systems]}]}}
- {id: event-driven-inventory, title: Use event streaming for omnichannel inventory, text: Stream inventory and order events to provide near-real-time available-to-promise across channels., category: architecture, priority: medium, sub_domains: [omnichannel, inventory, ecommerce], decision_key: inventory_data_latency, decision_option: event_streaming}
- {id: inventory-aware-reco, title: Make recommendations inventory and margin aware, text: Suppress out-of-stock items and apply margin and business-rule guardrails to recommendation ranking., category: architecture, priority: medium, when: {project_types_any: [recommendation_engine]}}
