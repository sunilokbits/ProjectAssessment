- {id: consent-misuse, title: "Personalisation or retail media without valid consent", category: privacy, likelihood: 3, impact: 4, mitigation: "Consent management integrated with CDP and activation channels; honour opt-outs.", indicators: [consent, cookie, retail media, personalization, third-party sharing]}
- {id: product-data-inconsistency, title: "Inconsistent product hierarchy and attributes across channels", category: data, likelihood: 4, impact: 3, mitigation: "Governed product master / PIM with stewardship and hierarchy versioning.", indicators: [product hierarchy, sku mapping, pim, product attributes]}
- {id: inventory-inaccuracy, title: "Inaccurate inventory undermines omnichannel promises", category: data, likelihood: 4, impact: 4, mitigation: "Measure inventory accuracy, use safety buffers for ATP and improve cycle counting / RFID.", sub_domains: [inventory, omnichannel, stores], indicators: [inventory accuracy, phantom inventory, out of stock, stock count]}
