- {id: shopper-pii-exposure, title: "Shopper PII or loyalty data exposure", category: security, likelihood: 3, impact: 4, mitigation: "Classify and mask PII, restrict access to customer data and monitor exports.", indicators: [pii, customer data, loyalty data, email address, phone number]}
