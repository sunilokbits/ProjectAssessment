- {id: sales-reconciliation, title: "Reported sales do not reconcile with finance", category: data, likelihood: 3, impact: 4, mitigation: "Reconcile POS / e-commerce sales, returns and discounts to ERP daily.", indicators: [sales reconciliation, tlog, net sales, returns]}
- {id: promo-effect-misattribution, title: "Promotion and cannibalisation effects misattributed in forecasts or pricing", category: business, likelihood: 3, impact: 3, mitigation: "Capture promotion mechanics and model cannibalisation and halo effects explicitly.", sub_domains: [pricing, merchandising, inventory], indicators: [promotion, cannibalization, uplift, baseline]}
- {id: recommendation-harm, title: "Recommendations that damage trust (out-of-stock, inappropriate or biased items)", category: business, likelihood: 3, impact: 3, mitigation: "Business-rule guardrails, inventory-aware ranking and monitoring of recommendation quality.", sub_domains: [recommendation_systems, ecommerce], when: {project_types_any: [recommendation_engine]}}
