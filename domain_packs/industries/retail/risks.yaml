- {id: dynamic-pricing-compliance, title: "Pricing practices breach consumer protection rules", category: compliance, likelihood: 2, impact: 4, mitigation: "Review dynamic pricing and price-reduction claims against consumer law (e.g. EU Omnibus prior-price rule).", sub_domains: [pricing, ecommerce], indicators: [dynamic pricing, price reduction, was price, strike-through price]}
