- {id: conversion-rate, name: Conversion rate, description: Share of sessions or store visits resulting in a purchase., formula: transactions / sessions or footfall, unit: "%", direction: higher_is_better, category: business}
- {id: average-order-value, name: Average order value, description: Average revenue per order or transaction., formula: net sales / number of orders, unit: currency, direction: higher_is_better, category: business}
- {id: basket-size, name: Basket size, description: Average number of units or items per transaction., formula: units sold / transactions, unit: units, direction: higher_is_better, category: business}
- {id: inventory-turnover, name: Inventory turnover, description: How often inventory is sold and replaced over a period., formula: cost of goods sold / average inventory at cost, unit: turns, direction: higher_is_better, category: operational, sub_domains: [inventory, merchandising, supply_chain, stores]}
- {id: customer-lifetime-value, name: Customer lifetime value, description: Expected net margin from a customer over the relationship., unit: currency, direction: higher_is_better, category: customer, sub_domains: [customer_loyalty, ecommerce, recommendation_systems]}
- {id: same-store-sales, name: Like-for-like sales growth, description: Sales growth for stores open in both comparison periods., unit: "%", direction: higher_is_better, category: business, sub_domains: [stores]}
- {id: sell-through, name: Sell-through rate, description: Share of received inventory sold within a period., formula: units sold / units received, unit: "%", direction: higher_is_better, category: operational, sub_domains: [merchandising, inventory, pricing]}
- {id: on-shelf-availability, name: On-shelf availability, description: Share of SKUs available to purchase when shoppers look for them., unit: "%", direction: higher_is_better, category: operational, sub_domains: [stores, inventory, grocery]}
- {id: gross-margin-return, name: Gross margin return on inventory investment, description: Gross margin earned per unit of average inventory cost., formula: gross margin / average inventory at cost, unit: ratio, direction: higher_is_better, category: financial, sub_domains: [merchandising, inventory]}
- {id: shrink-rate, name: Shrink rate, description: "Inventory loss from theft, damage and error relative to sales.", unit: "%", direction: lower_is_better, category: operational, sub_domains: [stores, inventory, grocery]}
- {id: markdown-rate, name: Markdown rate, description: Markdown value relative to sales., unit: "%", direction: lower_is_better, category: financial, sub_domains: [pricing, merchandising]}
- {id: loyalty-repeat-rate, name: Repeat purchase rate, description: Share of customers purchasing again within a period., unit: "%", direction: higher_is_better, category: customer, sub_domains: [customer_loyalty, ecommerce]}
- {id: order-fulfilment-time, name: Order fulfilment cycle time, description: Time from order placement to delivery or pick-up readiness., unit: hours, direction: lower_is_better, category: operational, sub_domains: [omnichannel, ecommerce]}
- {id: return-rate, name: Return rate, description: Share of sold units returned., unit: "%", direction: lower_is_better, category: operational, sub_domains: [ecommerce, omnichannel]}
