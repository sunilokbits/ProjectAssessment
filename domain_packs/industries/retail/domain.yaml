key: retail
name: Retail
kind: industry
version: 1.0.0
description: Store-based and digital retail including e-commerce, omnichannel fulfilment, merchandising, pricing, inventory, loyalty and personalisation.
aliases: [retailer, e-commerce, ecommerce, omnichannel retail, grocery, fashion retail, specialty retail, d2c]
sort_order: 40
sub_domains:
  - key: stores
    name: Stores and Store Operations
    description: Physical store operations, POS, workforce, shrink and store performance.
    keywords: [store operations, point of sale, pos, store manager, footfall, shrink, planogram compliance, store labor, checkout, self-checkout]
  - key: ecommerce
    name: E-commerce
    description: Online storefronts, marketplaces, digital checkout and web/app analytics.
    keywords: [e-commerce, ecommerce, online store, webshop, shopping cart, checkout, marketplace, shopify, salesforce commerce cloud, adobe commerce, clickstream]
  - key: omnichannel
    name: Omnichannel and Fulfilment
    description: Unified commerce, BOPIS, ship-from-store, returns and order orchestration.
    keywords: [omnichannel, unified commerce, bopis, click and collect, ship from store, curbside, order management system, returns, last mile, fulfilment]
  - key: merchandising
    name: Merchandising and Assortment
    description: Category management, assortment planning, space planning and vendor management.
    keywords: [merchandising, assortment planning, category management, planogram, space planning, range planning, open to buy, private label, vendor]
  - key: pricing
    name: Pricing and Promotions
    description: Regular, promotional and markdown pricing, price optimisation and competitor pricing.
    keywords: [pricing, price optimization, markdown, promotion, promo, price elasticity, competitor pricing, dynamic pricing, coupon]
  - key: inventory
    name: Inventory and Replenishment
    description: Inventory visibility, allocation, replenishment and distribution centre operations.
    keywords: [inventory, stock level, replenishment, allocation, out of stock, overstock, safety stock, distribution center, warehouse management, stock count]
  - key: customer_loyalty
    name: Customer Loyalty and CRM
    description: Loyalty programs, CRM, segmentation, campaigns and customer data platforms.
    keywords: [loyalty program, loyalty card, rewards, points, crm, customer segmentation, cdp, customer data platform, member, clienteling]
  - key: recommendation_systems
    name: Recommendation and Personalisation
    description: Product recommendations, search, personalisation and retail media.
    keywords: [recommendation engine, product recommendations, personalization, next best offer, site search, retail media, cross-sell, upsell]
  - key: supply_chain
    name: Retail Supply Chain and Sourcing
    description: Sourcing, purchase orders, inbound logistics and supplier collaboration.
    keywords: [sourcing, purchase order, supplier, inbound logistics, vendor compliance, edi, asn, landed cost]
  - key: grocery
    name: Grocery and Fresh
    description: Grocery-specific operations including fresh, perishables and waste.
    keywords: [grocery, supermarket, fresh food, perishables, food waste, shelf life, weighted items]
  - key: payments_checkout
    name: Payments and Checkout
    description: In-store and online payments, wallets, BNPL and gift cards.
    keywords: [payment gateway, card payment, digital wallet, bnpl, gift card, tokenization, chargeback]
