key: healthcare
name: Healthcare
kind: industry
version: 1.0.0
description: Hospitals and health systems, clinical operations, patient management, health analytics, medical devices, healthcare payers and provider organisations.
aliases: [health care, healthcare provider, health system, hospital, payer, provider, healthtech]
sort_order: 30
sub_domains:
  - key: hospitals
    name: Hospitals and Health Systems
    description: Acute care hospitals, integrated delivery networks and multi-site health systems.
    keywords: [hospital, health system, inpatient, outpatient, emergency department, bed management, admission, discharge, idn, ward]
  - key: clinical_operations
    name: Clinical Operations
    description: Clinical workflows, orders, care pathways, nursing, pharmacy and theatre operations.
    keywords: [clinical workflow, cpoe, order entry, care pathway, nursing, medication administration, operating theatre, clinical decision support, pharmacy]
  - key: patient_management
    name: Patient Management
    description: Patient registration, scheduling, access, engagement and care coordination.
    keywords: [patient registration, patient scheduling, patient portal, patient engagement, care coordination, mpi, master patient index, referral, appointment]
  - key: health_analytics
    name: Health Analytics and Population Health
    description: Clinical quality, population health, outcomes and operational analytics.
    keywords: [population health, clinical analytics, quality measures, hedis, readmission, risk stratification, outcomes research, care gaps, value-based care]
  - key: medical_devices
    name: Medical Devices and Connected Care
    description: Device integration, remote patient monitoring and software as a medical device.
    keywords: [medical device, remote patient monitoring, rpm, wearable, samd, software as a medical device, device integration, bedside monitor, infusion pump]
  - key: healthcare_payers
    name: Healthcare Payers
    description: Health plans, managed care, claims adjudication, member management and risk adjustment.
    keywords: [health plan, payer, member, claims adjudication, prior authorization, risk adjustment, medicare advantage, medicaid, utilization management, provider network]
  - key: healthcare_providers
    name: Healthcare Providers and Physician Groups
    description: Physician practices, ambulatory clinics, ACOs and provider revenue cycle.
    keywords: [physician practice, ambulatory, clinic, aco, provider group, primary care, specialty care, urgent care]
  - key: revenue_cycle
    name: Revenue Cycle Management
    description: Charge capture, coding, billing, claims submission, denials and collections.
    keywords: [revenue cycle, rcm, charge capture, medical coding, claim submission, denials management, "837", "835", remittance, patient billing]
  - key: diagnostics_imaging
    name: Diagnostics, Laboratory and Imaging
    description: Laboratory information systems, radiology, PACS and diagnostic reporting.
    keywords: [laboratory, lis, radiology, pacs, dicom, imaging, pathology, ris, lab results]
  - key: digital_health
    name: Digital Health and Telehealth
    description: Telehealth, virtual care, digital front door and consumer health apps.
    keywords: [telehealth, telemedicine, virtual care, digital front door, health app, virtual visit, mhealth]
  - key: public_health
    name: Public Health and Government Health
    description: Public health surveillance, national health programs and registries.
    keywords: [public health, disease surveillance, immunization registry, national health, abdm, nhs, health registry]
