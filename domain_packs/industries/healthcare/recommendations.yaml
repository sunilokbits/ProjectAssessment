- {id: minimum-necessary, title: Define a minimum-necessary PHI data set, text: Agree with privacy and compliance which PHI elements are required per use case and exclude the rest at ingestion., category: security, priority: high, when: {data_classifications_any: [phi]}}
- {id: baa-before-data, title: Execute BAAs before any PHI is loaded, text: Ensure BAAs or data processing agreements are signed with cloud providers and vendors before PHI enters any environment., category: compliance, priority: high, when: {data_classifications_any: [phi]}}
- {id: clinical-safety-case, title: Establish a clinical safety case for clinically used outputs, text: "Maintain a hazard log, clinician validation and post-deployment monitoring for alerts, predictions and AI summaries.", category: governance, priority: high, when: {technologies_any: [machine_learning, generative_ai, agentic_ai, ai_agents, advanced_analytics]}}
- {id: fhir-first-integration, title: Prefer FHIR APIs for new integrations, text: Use FHIR R4 APIs and bulk export where available; retain HL7 v2 for real-time ADT and results feeds., category: integration, priority: medium, decision_key: clinical_integration_standard, decision_option: fhir_first}
- {id: deidentified-nonprod, title: Use de-identified or synthetic data in non-production, text: Never use identifiable PHI in development and test; use certified de-identification or synthetic patient data., category: security, priority: high}
- {id: health-data-residency-region, title: Host health data in-jurisdiction, text: Select in-country or in-region cloud regions where health-data residency laws apply., category: architecture, priority: high, when: {geographies_any: [CA, AU, IN, AE, SA, DE, FR]}, decision_key: hosting_region, decision_option: in_country}
