- {id: readmission-rate, name: 30-day readmission rate, description: Share of discharges followed by an unplanned readmission within 30 days., unit: "%", direction: lower_is_better, category: clinical, sub_domains: [hospitals, health_analytics, healthcare_payers]}
- {id: average-length-of-stay, name: Average length of stay, description: Mean inpatient days per admission., formula: total inpatient days / admissions, unit: days, direction: lower_is_better, category: operational, sub_domains: [hospitals, clinical_operations]}
- {id: bed-occupancy, name: Bed occupancy rate, description: Share of available beds occupied., unit: "%", direction: target_range, category: operational, sub_domains: [hospitals]}
- {id: ed-wait-time, name: Emergency department wait time, description: Time from arrival to clinician assessment., unit: minutes, direction: lower_is_better, category: operational, sub_domains: [hospitals, clinical_operations]}
- {id: patient-satisfaction, name: Patient experience score, description: Patient-reported experience score (e.g. HCAHPS or NPS)., unit: score, direction: higher_is_better, category: experience}
- {id: no-show-rate, name: Appointment no-show rate, description: Share of booked appointments not attended., unit: "%", direction: lower_is_better, category: operational, sub_domains: [patient_management, healthcare_providers, digital_health]}
- {id: claim-denial-rate, name: Claim denial rate, description: Share of submitted claims denied on first submission., unit: "%", direction: lower_is_better, category: financial, sub_domains: [revenue_cycle, healthcare_providers, healthcare_payers]}
- {id: days-in-ar, name: Days in accounts receivable, description: Average days to collect payment for services., unit: days, direction: lower_is_better, category: financial, sub_domains: [revenue_cycle, healthcare_providers, hospitals]}
- {id: medical-loss-ratio, name: Medical loss ratio, description: Share of premium spent on clinical services and quality improvement., unit: "%", direction: target_range, category: financial, sub_domains: [healthcare_payers]}
- {id: care-gap-closure, name: Care gap closure rate, description: Share of identified care gaps closed in the period., unit: "%", direction: higher_is_better, category: clinical, sub_domains: [health_analytics, healthcare_payers, healthcare_providers]}
- {id: duplicate-patient-rate, name: Duplicate patient record rate, description: Share of patient records that are duplicates in the master patient index., unit: "%", direction: lower_is_better, category: data}
- {id: hospital-acquired-infection, name: Hospital-acquired infection rate, description: Healthcare-associated infections per 1000 patient days., unit: per 1000 patient days, direction: lower_is_better, category: clinical, sub_domains: [hospitals, clinical_operations]}
