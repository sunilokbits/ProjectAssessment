- {id: phi-exposure, title: "PHI exposure or breach", category: security, likelihood: 3, impact: 5, mitigation: "Minimum-necessary data sets, encryption, de-identification, role-based access, audit logging and breach response aligned to HIPAA / local law.", indicators: [phi, patient data, medical record, mrn, ssn, health information, ehr extract]}
- {id: patient-data-accuracy, title: "Inaccurate or mismatched patient data used for care or reporting", category: data, likelihood: 3, impact: 5, mitigation: "EMPI-based patient matching, duplicate/overlay monitoring, source-to-target reconciliation and clinician validation of derived data.", indicators: [patient matching, duplicate patient, mrn, empi, overlay, data quality]}
- {id: consent-violation, title: "Patient consent or data-sharing preferences not enforced", category: privacy, likelihood: 3, impact: 5, mitigation: "Capture consent as data, propagate consent flags downstream and enforce at access and sharing points.", indicators: [consent, opt-out, data sharing, research use, 42 cfr part 2]}
- {id: clinical-integration-failure, title: "Clinical-system integration failures (HL7 / FHIR interfaces, EHR upgrades)", category: integration, likelihood: 4, impact: 4, mitigation: "Interface inventory, message validation, integration-engine monitoring and regression testing around EHR upgrades.", indicators: [hl7, fhir, interface engine, adt, epic upgrade, integration engine]}
- {id: data-residency-health, title: "Health data hosted outside permitted jurisdiction", category: compliance, likelihood: 3, impact: 4, mitigation: "Confirm residency obligations per jurisdiction and select compliant cloud regions and support models.", indicators: [data residency, data sovereignty, offshore, cross-border, localisation], when: {technologies_any: [azure, aws, gcp, databricks, snowflake, microsoft_fabric, cloud_migration]}}
- {id: clinical-safety-hazard, title: "Analytics or AI output causes patient-safety hazard", category: clinical, likelihood: 2, impact: 5, mitigation: "Clinical safety case and hazard log, clinician validation, human-in-the-loop and post-deployment monitoring.", indicators: [clinical decision, alert, sepsis, early warning, diagnosis prediction], when: {technologies_any: [machine_learning, generative_ai, agentic_ai, ai_agents, advanced_analytics]}}
- {id: unregulated-samd, title: "Software unintentionally qualifies as an unapproved medical device", category: compliance, likelihood: 2, impact: 5, mitigation: "Perform SaMD qualification assessment early; involve regulatory affairs.", sub_domains: [medical_devices, clinical_operations, digital_health, health_analytics], indicators: [samd, medical device, diagnostic algorithm, fda clearance, ce mark]}
- {id: terminology-mapping, title: "Inconsistent clinical code mapping (ICD, SNOMED, LOINC, local codes)", category: data, likelihood: 4, impact: 3, mitigation: "Use a terminology service with governed code maps and version control.", indicators: [icd-10, snomed, loinc, local codes, code mapping]}
- {id: ehr-vendor-dependency, title: "EHR vendor access or licensing constraints on data extraction", category: integration, likelihood: 3, impact: 3, mitigation: "Confirm reporting database, API and bulk export entitlements with the EHR vendor early.", indicators: [clarity, caboodle, vendor api, epic, cerner]}
- {id: claims-denials, title: "Revenue impact from coding or claims data errors", category: business, likelihood: 3, impact: 4, mitigation: "Validate coding and claim edits in parallel run; monitor denial rates during cut-over.", sub_domains: [revenue_cycle, healthcare_payers, healthcare_providers], indicators: [denials, "837", "835", coding, charge capture]}
- {id: device-data-reliability, title: "Unreliable device or remote-monitoring data", category: data, likelihood: 3, impact: 4, mitigation: "Validate units, timestamps and device identity; detect signal gaps and artefacts.", sub_domains: [medical_devices, digital_health], indicators: [device data, wearable, telemetry, rpm, vitals]}
