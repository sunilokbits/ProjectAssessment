system_addition: |
  Use SaaS terminology (tenant, account, user, subscription, ARR, NRR, churn, usage event, health score).
  Treat tenant isolation, customer contract data-use limits and attestation scope (SOC 2, ISO 27001) as primary constraints.
  Distinguish internal analytics from customer-facing embedded analytics and in-product AI.
stage_additions:
  discovery: Ask about tenant model, telemetry, billing, metric definitions, residency commitments and attestation timelines.
extraction_hints: Map "workspace", "org" and "instance" to Tenant; map "logo" and "customer" to Account; map "seat" to User.
