- {id: win-rate, name: Proposal win rate, description: Share of proposals won., unit: "%", direction: higher_is_better, category: growth}
- {id: revenue-per-fee-earner, name: Revenue per professional, description: Revenue per fee-earning professional., unit: currency, direction: higher_is_better, category: productivity}
