- {id: occupancy-rate, name: Occupancy rate, description: Share of leasable space or units occupied., unit: "%", direction: higher_is_better, category: portfolio, sub_domains: [residential, commercial, property_management]}
- {id: noi, name: Net operating income, description: Property revenue less operating expenses., unit: currency, direction: higher_is_better, category: financial, sub_domains: [commercial, residential, property_management]}
