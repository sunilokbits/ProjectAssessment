- {id: cpi, name: Cost performance index, description: Earned value divided by actual cost., formula: EV / AC, unit: ratio, direction: higher_is_better, category: project, sub_domains: [construction]}
- {id: spi, name: Schedule performance index, description: Earned value divided by planned value., formula: EV / PV, unit: ratio, direction: higher_is_better, category: project, sub_domains: [construction]}
