business_processes:
  - Acquisition and due diligence
  - Leasing and lease administration
  - Rent collection and arrears management
  - Property and facilities maintenance
  - Service charge and CAM reconciliation
  - Construction bidding and estimating
  - Project controls (cost, schedule, change)
  - Subcontractor and procurement management
  - Building operations and energy management
  - Portfolio valuation and investor reporting
capabilities:
  - Portfolio performance analytics
  - Lease abstraction and intelligence
  - Predictive maintenance for building systems
  - Construction cost and schedule forecasting
  - Energy and carbon optimisation
  - Tenant experience analytics
  - Site safety analytics
  - Investor reporting
source_systems:
  - "Property management and accounting (Yardi Voyager, MRI Software, RealPage, Entrata, AppFolio)"
  - "Lease administration (Visual Lease, CoStar Real Estate Manager, Accruent Lx)"
  - "Construction management (Procore, Autodesk Construction Cloud, Oracle Aconex, Oracle Primavera P6)"
  - "Estimating and ERP (Sage Intacct Construction, Viewpoint Vista, CMiC, InEight)"
  - "BIM and design (Autodesk Revit, Navisworks, Bentley)"
  - "Building management systems (Johnson Controls Metasys, Siemens Desigo CC, Honeywell, Schneider EcoStruxure)"
  - "CAFM / IWMS (Planon, IBM TRIRIGA, ServiceNow WSD)"
  - "Market data (CoStar, MSCI Real Assets)"
data_entities: [Property, Unit, Lease, Tenant, Rent charge, Work order, Project, Cost code, Change order, RFI, Subcontract, Building asset, Sensor reading, Valuation]
integration_patterns:
  - Property management system batch exports and APIs
  - "BACnet / Modbus / MQTT building telemetry"
  - "BIM model exchange (IFC)"
  - Construction platform APIs
  - "Lease document ingestion (OCR / document AI)"
related_technologies: [iot, power_bi, generative_ai, machine_learning, data_platform]
related_project_types: [document_intelligence, iot_analytics_platform, predictive_maintenance, bi_modernization]
