- id: fda-21-cfr-part-11
  name: FDA 21 CFR Part 11 - Electronic Records and Electronic Signatures
  short_name: 21 CFR Part 11
  geographies: [US]
  description: Requirements for trustworthy electronic records and signatures used for FDA-regulated activities.
  obligations: [System validation, Secure computer-generated audit trails, Electronic signature controls, Record retention and retrieval, Access controls]
  applicability_note: Applies to GxP records submitted to or required by FDA, regardless of where the company is based.
