- {id: validation-gap, title: "GxP system deployed without adequate validation", category: compliance, likelihood: 3, impact: 5, mitigation: "Classify GxP impact early, apply risk-based CSA, involve Quality in design and release.", indicators: [gxp, validation, csv, csa, gamp, iq oq pq]}
- {id: data-integrity-findings, title: "Data integrity failures leading to inspection findings or warning letters", category: compliance, likelihood: 3, impact: 5, mitigation: "Implement ALCOA+ controls, audit trail review and periodic data integrity assessments.", indicators: [data integrity, audit trail, alcoa, "483", warning letter]}
- {id: validated-state-drift, title: "Loss of validated state due to uncontrolled cloud or platform changes", category: compliance, likelihood: 3, impact: 4, mitigation: "Supplier qualification, release monitoring, automated regression testing and GxP change control.", indicators: [saas, cloud release, auto-update, continuous delivery], when: {technologies_any: [azure, aws, gcp, databricks, snowflake, microsoft_fabric, cloud_migration]}}
- {id: missed-adverse-events, title: "Adverse events received but not reported to pharmacovigilance in time", category: compliance, likelihood: 3, impact: 5, mitigation: "AE detection and routing process, training and reconciliation with the safety database.", sub_domains: [commercial_analytics, medical_affairs, pharmacovigilance, clinical_trials], indicators: [adverse event, side effect, patient program, social listening, call centre]}
- {id: subject-reidentification, title: "Re-identification of clinical trial subjects", category: privacy, likelihood: 2, impact: 5, mitigation: "Pseudonymisation, controlled data access environments and re-identification risk assessment for data sharing.", sub_domains: [clinical_trials, medical_affairs, biotech_cgt], indicators: [subject data, patient level, data sharing, unblinded]}
- {id: unblinding, title: "Inadvertent unblinding of trial data", category: data, likelihood: 2, impact: 5, mitigation: "Role-based access to randomisation data and segregation of blinded and unblinded teams.", sub_domains: [clinical_trials], indicators: [blinded, randomization, irt, unblinded]}
- {id: batch-release-impact, title: "Manufacturing or batch release disrupted by data or system issues", category: operational, likelihood: 3, impact: 5, mitigation: "Parallel run, contingency procedures and staged cut-over outside critical campaigns.", sub_domains: [manufacturing, quality_management, biotech_cgt], indicators: [batch release, mes, ebr, campaign, lims]}
- {id: third-party-licensing, title: "Third-party data licence restrictions limit platform use", category: business, likelihood: 3, impact: 3, mitigation: "Review IQVIA and RWD licence terms before ingesting; implement data-use tagging.", sub_domains: [commercial_analytics, medical_affairs], indicators: [iqvia, symphony, licensed data, rwd]}
- {id: ip-leakage, title: "Leakage of research IP or confidential compound data", category: security, likelihood: 2, impact: 5, mitigation: "Classify IP, restrict access, monitor egress and govern GenAI tool usage.", sub_domains: [drug_discovery, biotech_cgt], indicators: [compound, structure, patent, proprietary]}
- {id: unvalidated-ai, title: "AI used in GxP or safety decisions without validation", category: compliance, likelihood: 3, impact: 4, mitigation: "Define intended use, validate models, document lifecycle controls and human oversight.", when: {technologies_any: [machine_learning, generative_ai, agentic_ai, ai_agents]}}
- {id: hcp-transparency, title: "HCP interactions and transfers of value misreported", category: compliance, likelihood: 2, impact: 4, mitigation: "Reconcile spend data and apply Sunshine / EFPIA disclosure rules.", sub_domains: [commercial_analytics, medical_affairs], indicators: [transfer of value, sunshine act, open payments, efpia]}
