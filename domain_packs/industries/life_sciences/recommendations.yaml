- {id: adopt-csa, title: Adopt risk-based Computer Software Assurance, text: Apply GAMP 5 Second Edition / CSA principles to focus validation on GxP-critical functions and automate test evidence., category: compliance, priority: high, decision_key: validation_approach, decision_option: risk_based_csa}
- {id: segregate-gxp-zones, title: Segregate GxP and non-GxP data zones, text: Separate validated GxP zones from exploratory zones to limit validation scope and protect data integrity., category: architecture, priority: high}
- {id: quality-early, title: Engage Quality Assurance from inception, text: "Involve QA in GxP classification, supplier qualification and release approval from the start of the project.", category: governance, priority: high}
- {id: ae-routing, title: Build adverse event detection into patient and HCP-facing channels, text: Route potential AEs from digital and GenAI channels to pharmacovigilance with reconciliation., category: compliance, priority: high, sub_domains: [commercial_analytics, medical_affairs, pharmacovigilance]}
- {id: validate-ai-intended-use, title: Define intended use and validation for AI in GxP processes, text: Document intended use and acceptance criteria and keep human review for AI used in quality or safety decisions., category: governance, priority: medium, when: {technologies_any: [machine_learning, generative_ai, agentic_ai, ai_agents]}}
- {id: phased-gxp-cutover, title: Phase GxP cut-over around manufacturing campaigns and study milestones, text: Avoid cut-over during critical batch campaigns or database locks; run legacy and new systems in parallel where feasible., category: delivery, priority: medium, decision_key: delivery_approach, decision_option: phased_parallel_run}
