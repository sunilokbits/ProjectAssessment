key: life_sciences
name: Life Sciences
kind: industry
version: 1.0.0
description: Pharmaceutical, biotech and medtech organisations across drug discovery, clinical development, GxP manufacturing, pharmacovigilance, regulatory affairs and commercial operations.
aliases: [pharma, pharmaceutical, biotech, biopharma, life science, medtech, cro]
sort_order: 35
sub_domains:
  - key: drug_discovery
    name: Drug Discovery and Research
    description: Target identification, screening, lead optimisation, omics and preclinical research.
    keywords: [drug discovery, target identification, high-throughput screening, lead optimization, preclinical, omics, genomics, assay, eln, compound library, molecule]
  - key: clinical_trials
    name: Clinical Trials and Development
    description: Study design, site and patient recruitment, data management, biostatistics and trial operations.
    keywords: [clinical trial, clinical study, protocol, edc, ctms, site management, patient recruitment, cdisc, sdtm, adam, biostatistics, cro, investigator]
  - key: manufacturing
    name: GxP Manufacturing and Supply
    description: Drug substance and product manufacturing, batch records, quality control and supply chain.
    keywords: [gmp manufacturing, batch record, ebr, mes, quality control, lims, deviation, capa, batch release, serialization, cold chain, cmo]
  - key: quality_management
    name: Quality Management
    description: QMS processes including deviations, CAPA, change control, audits and document control.
    keywords: [qms, quality management system, deviation, capa, change control, audit, sop, document control, veeva vault quality]
  - key: pharmacovigilance
    name: Pharmacovigilance and Drug Safety
    description: Adverse event intake, case processing, signal detection and safety reporting.
    keywords: [pharmacovigilance, drug safety, adverse event, icsr, signal detection, argus, arisg, medwatch, eudravigilance, psur, pbrer]
  - key: regulatory
    name: Regulatory Affairs
    description: Submissions, registrations, labelling and regulatory information management.
    keywords: [regulatory affairs, regulatory submission, ectd, ind, nda, bla, maa, rim, labeling, idmp, health authority]
  - key: commercial_analytics
    name: Commercial Analytics
    description: Sales force effectiveness, market access, HCP engagement, patient services and brand analytics.
    keywords: [commercial analytics, hcp, sales force effectiveness, market access, brand analytics, iqvia, rx data, territory alignment, omnichannel engagement, patient services, key account]
  - key: medical_affairs
    name: Medical Affairs
    description: Medical information, MSL engagement, real-world evidence and publications.
    keywords: [medical affairs, msl, medical science liaison, medical information, real-world evidence, rwe, real-world data, publications, heor]
  - key: medtech
    name: Medical Technology
    description: Medical device design, manufacturing, post-market surveillance and UDI.
    keywords: [medical device manufacturer, medtech, design history file, udi, post-market surveillance, iso 13485, complaint handling]
  - key: biotech_cgt
    name: Biotech and Cell and Gene Therapy
    description: Biologics, cell and gene therapies with chain of identity and vein-to-vein logistics.
    keywords: [biologics, cell therapy, gene therapy, chain of identity, chain of custody, vein-to-vein, car-t, bioprocess]
