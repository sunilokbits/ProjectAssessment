# ---------------------------------------------------------------- extraction
requirement_markers: [shall, must, should, requires, "will need", "needs to", "need to", required, requirement, "is expected to",
                      "has to", "have to", "ability to", "support", "provide", "enable", "want to", "would like"]

requirement_categories:
  security: [encrypt, encryption, access control, rbac, authentication, sso, mfa, audit, masking, tokenization, firewall, vulnerability, secrets]
  privacy: [consent, gdpr, pii, phi, personal data, anonymi, pseudonymi, right to be forgotten, data subject, retention]
  compliance: [regulator, regulatory, compliance, audit trail, sox, hipaa, pci, basel, ifrs, rbi, sebi, fda, gxp]
  performance: [latency, response time, throughput, concurrent, real-time, real time, near real-time, sla, seconds, milliseconds]
  availability: [availability, uptime, disaster recovery, rto, rpo, failover, high availability, 99.9]
  scalability: [scalable, scale, scalability, growth, volume, terabytes, petabytes, millions of]
  data: [data model, ingestion, pipeline, etl, elt, source system, data quality, lineage, master data, cdc, batch]
  integration: [api, integration, interface, connector, kafka, event, message queue, webhook, sftp, sap, salesforce]
  reporting: [report, dashboard, kpi, visuali, power bi, tableau, analytics, insight]
  ai: [machine learning, model, prediction, genai, generative, llm, chatbot, copilot, agent, rag, recommendation]
  usability: [user-friendly, intuitive, self-service, accessibility, wcag, mobile]
  operations: [monitoring, alerting, observability, devops, ci/cd, support, runbook, cost]

non_functional_categories: [security, privacy, compliance, performance, availability, scalability, usability, operations]

category_dimension:
  business: business_alignment
  functional: business_alignment
  reporting: business_alignment
  data: data_availability
  integration: integration_readiness
  architecture: architecture_fit
  performance: architecture_fit
  scalability: architecture_fit
  availability: operational_readiness
  operations: operational_readiness
  security: security_controls
  privacy: privacy_protection
  compliance: privacy_protection
  delivery: delivery_governance
  ai: architecture_fit
  usability: business_alignment
  domain: business_alignment
  technology: architecture_fit

# Vague words in requirements -> clarification question templates ({term}, {excerpt})
ambiguity_terms:
  real-time: {question: "What latency does 'real-time' mean for this requirement (e.g. < 1 s, < 1 min, < 15 min)? Requirement: \"{excerpt}\"", category: performance, dimension: architecture_fit}
  near real-time: {question: "What is the maximum acceptable data latency for 'near real-time'? Requirement: \"{excerpt}\"", category: performance, dimension: architecture_fit}
  fast: {question: "What measurable response-time target defines 'fast'? Requirement: \"{excerpt}\"", category: performance, dimension: architecture_fit}
  scalable: {question: "What growth must the solution support (data volume, users, transactions) over what period? Requirement: \"{excerpt}\"", category: scalability, dimension: architecture_fit}
  high availability: {question: "What availability target (e.g. 99.9%) and RTO/RPO apply? Requirement: \"{excerpt}\"", category: availability, dimension: operational_readiness}
  secure: {question: "Which specific security controls and standards are expected for '{term}'? Requirement: \"{excerpt}\"", category: security, dimension: security_controls}
  user-friendly: {question: "How will usability be measured and who are the target user personas? Requirement: \"{excerpt}\"", category: usability, dimension: business_alignment}
  tbd: {question: "This requirement contains an open item (TBD). Who owns the decision and by when? Requirement: \"{excerpt}\"", category: delivery, dimension: delivery_governance}
  as needed: {question: "What criteria define 'as needed' (frequency, trigger, owner)? Requirement: \"{excerpt}\"", category: delivery, dimension: delivery_governance}
  etc: {question: "The requirement lists items ending with 'etc.'. Please provide the complete list. Requirement: \"{excerpt}\"", category: business, dimension: business_alignment}
  large volume: {question: "Please quantify 'large volume' (records/day, GB/TB, peak rate). Requirement: \"{excerpt}\"", category: scalability, dimension: architecture_fit}
  single source of truth: {question: "Which entities must the 'single source of truth' cover, and which system wins on conflict? Requirement: \"{excerpt}\"", category: data, dimension: data_availability}
  "360": {question: "Which data domains and attributes make up the 360-degree view, and who are its consumers? Requirement: \"{excerpt}\"", category: data, dimension: data_availability}
  ai-powered: {question: "What business decision or task should AI support, and what accuracy/acceptance criteria apply? Requirement: \"{excerpt}\"", category: ai, dimension: architecture_fit}
  seamless: {question: "What does 'seamless' integration mean in measurable terms (systems, latency, error handling)? Requirement: \"{excerpt}\"", category: integration, dimension: integration_readiness}
