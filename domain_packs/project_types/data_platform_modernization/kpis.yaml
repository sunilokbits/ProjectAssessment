  unit: '%'
  direction: higher_is_better
  category: delivery
- id: dpm-legacy-decommissioned
  name: Legacy components decommissioned
  description: Share of legacy platform components switched off.
  unit: '%'
  direction: higher_is_better
  category: delivery
- id: dpm-run-cost
  name: Platform run cost
  description: Monthly total cost of ownership of the data platform.
